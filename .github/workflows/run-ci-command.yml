name: PPU CI command

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  command:
    if: >-
      github.repository == 'flytiger-eco/vllm-for-sail' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      contains(github.event.comment.body, '/ci')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: read
      statuses: write
    concurrency:
      group: ppu-ci-command-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - name: Handle PPU CI command
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_TRUSTED_USERS: ${{ vars.CI_TRUSTED_USERS }}
        run: python scripts/ci/ppu_ci_command.py command
      - name: Report unexpected controller failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `@${context.payload.comment.user.login} PPU CI command failed unexpectedly; CI may not have started. See ${url}\n\n<!-- ppu-ci-command:${context.payload.comment.id} -->`,
            });
