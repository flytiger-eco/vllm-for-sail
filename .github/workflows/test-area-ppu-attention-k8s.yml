# Attention Test (PPU, K8s) —— test-area-ppu-attention 的 K8s 调度版
# ==============================================================================
# 这是把「最轻量的 area = attention」从 [self-hosted, ppu] docker 模式改造到
# K8s（flytiger-eco/ppu-distributed-action）的最小可跑样例，独立成文件：
#   - 不被 ci.yml 以 workflow_call 拉起，也不进任何门禁；
#   - push 到本文件/被测脚本即自跑一次（见下方 on.push 的 paths 过滤），
#     方便「改完直接 push 就能单独把这个 area 的 CI 跑起来」；
#   - 另留 workflow_dispatch 手动入口。
#
# 为什么选 attention 作最小样例：单进程单 step、无真实模型（脚本内联构造
# config stub）、无 multi 段、45min 上限，是 11 个 area 里依赖最少、最自包含
# 的一个，最适合验证「K8s 调度 + 源码投递 + 装依赖 + 跑 pytest」这条链路。
#
# 与自托管版（test-area-ppu-attention.yml）的关键差异：
#   - 编排壳跑在 CPU-only 的 ARC runner（零占卡），算力只在 worker Pod 消耗；
#   - 源码投递交给 action 内建能力：本 workflow 先 actions/checkout，action 的
#     「Stage source to NAS」步骤自动把 $GITHUB_WORKSPACE 打包到 NAS，并在
#     Pod 内解压到 source_dir（默认 /workspace/source），command 在该目录下执行；
#   - 依赖/pytest 与用例选集完全复用现有脚本 scripts/ppu/*.sh（零改动）。
#
# 前置条件（若失败先查这里）：action 的源码暂存写 /wl_nas/devops，要求编排
# runner 的 job 容器已挂载 /wl_nas（集群侧 hook-extension configmap 待办）。
# 未挂载时该步骤会失败或 Pod 拿不到源码——这正是本样例要在真机上暴露的信号。
name: Attention Test (PPU, K8s)

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "TEST_MODE：all(默认) | single（attention 无 multi）"
        type: string
        default: all
  # workflow_dispatch 的运行按钮只对默认分支上已存在的 workflow 出现，特性分支
  # 上点不出来；故绑一个只盯自身路径的 push 触发：改完推上去即跑一次，不影响
  # 其他任何提交，也不触碰 ci.yml。
  push:
    paths:
      - ".github/workflows/test-area-ppu-attention-k8s.yml"
      - "scripts/ppu/ppu_install_dependency.sh"
      - "scripts/ppu/test-area-ppu-attention.sh"

concurrency:
  group: test-area-ppu-attention-k8s-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-vllm0.23.0-py312
  # push 触发时 inputs 为空，用 || 兜默认值
  TEST_MODE: ${{ inputs.test_mode || 'all' }}

jobs:
  ppu-attention-k8s:
    # CPU-only 编排 runner；container 提供 kubectl/工具链所在的 runner 镜像
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    # 含 K8s 调度 + 镜像准备开销（实测约 210s），故比 in-pod timeout 宽一档
    timeout-minutes: 60
    steps:
      # checkout 是触发 action 源码自动投递的前提：只有存在 $GITHUB_WORKSPACE
      # 内容时，action 才会打包暂存到 NAS 并在 Pod 内解压到 source_dir。
      # fetch-depth: 1 尽量缩小 .git，减少 NAS 打包体积与耗时。
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 为什么绕 base64：action.yml 的「校验 inputs」把 ${{ inputs.command }}
      # 直接文本插值进 `if [ -z "<command>" ]`，多行/含引号的 command 会引发
      # shell syntax error（见 ppu-action-smoke.yml 的详细注释）。base64 后是
      # 单行且只含 [A-Za-z0-9+/=]，被那对双引号整段吞掉，安全无副作用。
      - name: Build in-pod runner payload
        id: payload
        shell: bash
        run: |
          cat > /tmp/ppu-run.sh <<'RUNEOF'
          #!/bin/bash
          set -euo pipefail
          # action 把源码解压到 source_dir，默认 /workspace/source
          cd /workspace/source
          echo "[k8s-area] pwd=$(pwd) node=$NODE_NAME"
          echo "[k8s-area] TEST_MODE=${TEST_MODE:-all}"
          ls scripts/ppu/test-area-ppu-attention.sh
          bash scripts/ppu/ppu_install_dependency.sh
          bash scripts/ppu/test-area-ppu-attention.sh
          RUNEOF
          # 语法自检：runner 上早失败好过在 Pod 里烧一次调度
          bash -n /tmp/ppu-run.sh
          # tr 而非 base64 -w0：后者是 GNU 专有，前者到处都在
          echo "b64=$(base64 < /tmp/ppu-run.sh | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "payload $(wc -c < /tmp/ppu-run.sh) bytes"

      - name: Run PPU attention tests (K8s)
        id: ppu
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          nnodes: 0            # 单机
          nproc_per_node: 1    # attention single 段限 1 卡
          node_selector: board-type=OAM-810E
          # 左宿主机 / 右容器内。/nas_aisw、/mnt/wl_nas 默认已挂，这里显式写出
          # 以对齐自托管版语义（重复的容器路径 action 会自动跳过）。
          host_volumes: /nas_aisw:/nas_aisw,/wl_nas:/mnt/wl_nas
          image: ${{ env.PPU_BASE_IMAGE }}
          namespace: ppu-sched
          timeout_minutes: 40  # 对齐自托管版 in-pod 上限
          cleanup_policy: always
          # 注入 Pod 环境：HF 缓存、设备标签、被测脚本读的 TEST_MODE，以及
          # ppu_install_dependency.sh 从私有 PyPI 补装 pytest 工具链所需的凭证。
          # extra_env 以逗号分隔 KEY=VAL，值内勿含逗号。
          extra_env: >-
            HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_DEVICE_LABEL=OAM-810E,TEST_MODE=${{ env.TEST_MODE }},PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }}
          # 必须单行、不含双引号，见上面 payload 步骤注释
          command: echo ${{ steps.payload.outputs.b64 }} | base64 -d > /tmp/ppu-run.sh && bash /tmp/ppu-run.sh

      # action 的 outputs 契约，落到 run 的 Summary 页便于回看
      - name: Report action outputs
        if: always()
        env:
          OUT_JOB_NAME: ${{ steps.ppu.outputs.job_name }}
          OUT_JOB_STATUS: ${{ steps.ppu.outputs.job_status }}
          OUT_DURATION: ${{ steps.ppu.outputs.duration_seconds }}
          OUT_TASK_PODS: ${{ steps.ppu.outputs.task_pods }}
        run: |
          {
            echo "### Attention Test (PPU, K8s)"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| test_mode | ${TEST_MODE:-all} |"
            echo "| image | \`${PPU_BASE_IMAGE}\` |"
            echo "| job_name | ${OUT_JOB_NAME:-<empty>} |"
            echo "| job_status | ${OUT_JOB_STATUS:-<empty>} |"
            echo "| duration_seconds | ${OUT_DURATION:-<empty>} |"
            echo "| task_pods | ${OUT_TASK_PODS:-<empty>} |"
          } >> "$GITHUB_STEP_SUMMARY"
