# Models Language nightly 测试——对位上游 models_language.yaml 的
# Standard(torch_nightly) / Extra Standard(%N) / Hybrid(%N) 三个 nightly step；
# 用例选集见 scripts/ppu/test-area-ppu-models-language.sh。
#
# nightly 调度由 nightly-ppu.yml 聚合；
# 本文件为单 area 手动入口（workflow_dispatch，用于首跑校准与排障），

# 串行：job 级 concurrency 与 nightly-ppu.yml 同 group（nightly-ppu-device），
#   单卡 PPU 互斥排队，防抢卡。

name: Models Language Test (Nightly)

# 不放 schedule/push/PR 触发，避免与聚合 workflow 重复调度。
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-vllm0.23.0-py312

jobs:
  # ==================== PPU Models Language（nightly 全量 3 段） ==================== #
  ppu-models-language-test:
    runs-on: [self-hosted, ppu]
    timeout-minutes: 300
    concurrency:
      group: nightly-ppu-device
      cancel-in-progress: false
    steps:
      - name: Clean workspace
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            ${{ env.PPU_BASE_IMAGE }} \
            bash -c "rm -rf /workspace/.??* /workspace/* 2>/dev/null; true"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run PPU models language tests
        timeout-minutes: 290
        env:
          PPU_ARTIFACTORY_USER: ${{ secrets.PPU_ARTIFACTORY_USER }}
          PPU_ARTIFACTORY_PASSWORD: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}
        run: |
          docker run --rm \
            --privileged \
            --network host \
            --add-host=$(hostname):$(hostname -I | awk '{print $1}') \
            --device=/dev/alixpu_ctl \
            --device=/dev/alixpu \
            --ipc=host \
            --init \
            --shm-size=8g \
            --ulimit memlock=-1 \
            --ulimit stack=67108864 \
            -v ${{ github.workspace }}:/workspace \
            -v /nas_aisw:/nas_aisw \
            -e HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub \
            -e PPU_ARTIFACTORY_USER \
            -e PPU_ARTIFACTORY_PASSWORD \
            -e PPU_DEVICE_LABEL=OAM-810E \
            ${{ env.PPU_BASE_IMAGE }} \
            bash -c "
              cd /workspace && \
              bash scripts/ppu/ppu_install_dependency.sh && \
              bash scripts/ppu/test-area-ppu-models-language.sh
            "

      - name: Publish test summary
        if: always()
        run: |
          f="test-results/summary.md"
          if [ -f "$f" ]; then
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Models Language Test (PPU)"
              echo ""
              echo "summary.md not produced — the in-container script exited"
              echo "before its EXIT trap fired (see run log)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-models-language-test-results
          path: test-results/
          if-no-files-found: warn
