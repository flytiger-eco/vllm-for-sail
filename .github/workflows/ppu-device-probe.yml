# 一次性探针：确认 worker Pod 内的 PPU 设备可见性语义。
#
# 背景：ppu-distributed-action 提交的 Pod 用 K8s extended resource 申请卡
#   （resources.limits."alibabacloud.com/ppu" = nproc_per_node），记账可靠、
#   不会超卖。但实测 privileged 模式下容器内 torch.cuda.device_count() == 16
#   （整机卡数）而非申请的卡数，各 area 脚本硬编码 CUDA_VISIBLE_DEVICES=0
#   就会全部挤到物理 0 号卡，area 之间无法并行。
#
# 待验证假设：privileged: true 使容器获得宿主机全量 /dev，绕过了 device
#   plugin 的细粒度设备注入。若成立，去掉 privileged 即可恢复隔离，
#   device_count 应等于 nproc_per_node，所有 area 脚本无需改动即可并行。
#
# 两个 job 除 privileged 外参数完全一致，构成对照实验。
# 结论落地后删除本文件。
name: PPU device visibility probe

on:
  push:
    # 只有改动本文件才触发，不干扰其它 area workflow；不限分支便于随手验证
    paths:
      - .github/workflows/ppu-device-probe.yml

permissions:
  contents: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-vllm0.23.0-py312

jobs:
  probe:
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # 必须串行：action 的 NAS 源码暂存路径是
      #   /wl_nas/devops/${RUN_ID}-${ATTEMPT}/${GITHUB_JOB}/{stage,source.tar.gz}
      # 只含 job key，matrix 各 leg 共享同一个值。两个 leg 并行时会往同一目录
      # cp -a + tar czf + rm -rf，互相踩到 tar 报 "file changed as we read it"
      # 并以 exit 1 结束（action 的打包步骤跑在 bash -e 下）。实测于
      # run 34325180549：两个 leg 的暂存路径同为 .../34325180549-1/probe/。
      max-parallel: 1
      matrix:
        include:
          - name: privileged
            privileged: "true"
          - name: unprivileged
            privileged: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 申请 2 卡而非 1 卡：隔离生效时 device_count 应为 2，与整机 16 区分度最大
      # （1 卡时若 plugin 恰好分到 0 号卡，会与"无隔离"现象混淆）
      - name: Build probe payload
        id: payload
        shell: bash
        run: |
          cat > /tmp/probe.sh <<'PROBEEOF'
          #!/bin/bash
          # 不用 set -e：每项探测都要跑完，单项失败不应中断后续采集
          echo "===== [1] action 注入的规模契约 ====="
          echo "NODE_NAME=${NODE_NAME:-} NPROC_PER_NODE=${NPROC_PER_NODE:-} RANK=${RANK:-}"

          echo "===== [2] 全量 env（找 device plugin 注入的分配结果）====="
          # device plugin 惯例是通过 env 告知分配到的设备序号，
          # 变量名未知，故全量打印后人工识别；本探针不下发任何 secret
          env | sort

          echo "===== [3] /dev 下的加速器设备节点 ====="
          ls -l /dev/ 2>/dev/null | grep -iE 'ppu|davinci|devmm|hisi|cambricon|vastai' || echo "(未匹配到设备节点)"
          echo "--- 设备节点计数 ---"
          ls /dev/ 2>/dev/null | grep -icE 'ppu[0-9]|davinci[0-9]' || true

          echo "===== [4] ppu-smi ====="
          command -v ppu-smi >/dev/null 2>&1 && ppu-smi || echo "(ppu-smi 不可用)"

          echo "===== [5] torch 可见卡数（关键指标）====="
          # 期望：隔离生效 -> 2；隔离失效 -> 16
          python3 -c 'import torch; print("device_count =", torch.cuda.device_count())' \
            2>&1 | tail -5

          echo "===== [6] cgroup 设备白名单 ====="
          cat /sys/fs/cgroup/devices/devices.list 2>/dev/null \
            || cat /sys/fs/cgroup/devices.allow 2>/dev/null \
            || echo "(cgroup v2 或不可读)"

          echo "===== PROBE DONE ====="
          PROBEEOF
          bash -n /tmp/probe.sh
          echo "b64=$(base64 < /tmp/probe.sh | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Probe (privileged=${{ matrix.privileged }})
        id: ppu
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          nnodes: 0
          nproc_per_node: 2
          node_selector: board-type=OAM-810E
          image: ${{ env.PPU_BASE_IMAGE }}
          namespace: ppu-sched
          timeout_minutes: 15
          cleanup_policy: always
          # 唯一变量：privileged。其余对齐 area workflow 现状
          container_options: |
            privileged: ${{ matrix.privileged }}
            host_ipc: true
            shm_size: "8Gi"
          command: echo ${{ steps.payload.outputs.b64 }} | base64 -d > /tmp/probe.sh && bash /tmp/probe.sh

      - name: Report
        if: always()
        env:
          VARIANT: ${{ matrix.name }}
          OUT_STATUS: ${{ steps.ppu.outputs.job_status }}
          OUT_PODS: ${{ steps.ppu.outputs.task_pods }}
        run: |
          {
            echo "### Probe: ${VARIANT} (nproc_per_node=2)"
            echo ""
            echo "- job_status: ${OUT_STATUS:-<empty>}"
            echo "- task_pods: ${OUT_PODS:-<empty>}"
            echo ""
            echo "判读：上一步日志 [5] 处 device_count == 2 说明设备隔离生效；"
            echo "== 16 说明无隔离。[2] 中若出现记录设备序号的变量，可据此做映射。"
          } >> "$GITHUB_STEP_SUMMARY"
