# 为当前 PR 构建 PPU wheel，供三个 area 共用。
name: PPU PR wheel build

on:
  workflow_call:
    inputs:
      pr_head_sha:
        description: "Exact PR head commit to build"
        required: true
        type: string
      base_ref:
        description: "Release branch and target vLLM version"
        required: true
        type: string
    outputs:
      artifact_name:
        description: "上传的 wheel artifact 名（供调用方 download-artifact）"
        value: ${{ jobs.build-wheel.outputs.artifact_name }}
      wheel_version:
        description: "构建的 wheel 版本号"
        value: ${{ jobs.build-wheel.outputs.wheel_version }}

# 排队不取消。
concurrency:
  group: ppu-pr-wheel-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-wheel:
    name: PPU wheel build
    if: |
      github.repository == 'flytiger-eco/vllm-for-sail'
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      PPU_BUILD_IMAGE: pkg.flytiger-eco.com/docker_build/pytorch:ubuntu24.04-py312.06
    strategy:
      matrix:
        python-version: ["3.12"]
        cuda-version: ["13.0"]
        # （PR #6 同款限制），届时需按 PR #6 模式拆独立 job。
        arch: [x86_64]
    outputs:
      wheel_version: ${{ steps.version.outputs.wheel_version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - name: Clean workspace (remove root-owned files from prior runs)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" alpine:3 \
            sh -c 'rm -rf /workspace/..?* /workspace/.[!.]* /workspace/*' || true

      # 构建对象 = 触发 run 的分支本身。
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.pr_head_sha }}
          submodules: "recursive"
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout SHA
        env:
          EXPECTED_SHA: ${{ inputs.pr_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      # 跨 run 恢复 ccache；restore-keys 前缀命中最近一次保存的缓存。
      # 首轮（本 PR 第一次跑）必然 miss——这是预期，用于填充缓存。
      - name: Restore ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ppu-ccache
          key: ppu-ccache-${{ runner.os }}-cu13.0-sdk2.2.0-${{ inputs.pr_head_sha }}
          restore-keys: |
            ppu-ccache-${{ runner.os }}-cu13.0-sdk2.2.0-

      # 固定本轮实际使用的镜像；同名 tag 更新也必须让 Rust 二进制缓存失效。
      - name: Compute Rust cache key
        id: rust-key
        env:
          RUST_INPUT_HASH: ${{ hashFiles('rust/**', 'rust-toolchain.toml', 'tools/build_rust.py', 'build_rust.sh', 'setup.py', 'pyproject.toml', 'vllm/envs.py', 'requirements/build/*.txt', 'requirements/ppu.txt', 'requirements/common.txt', 'scripts/ppu/build-ppu-wheel.sh', '.github/workflows/ppu-build-pr.yml') }}
        run: |
          test -n "$RUST_INPUT_HASH"
          docker pull "$PPU_BUILD_IMAGE"
          image_id=$(docker image inspect --format '{{.Id}}' "$PPU_BUILD_IMAGE")
          test -n "$image_id"
          echo "PPU_BUILD_IMAGE=$image_id" >> "$GITHUB_ENV"
          echo "RUST_CACHE_DIR=$RUNNER_TEMP/ppu-rust-artifacts" >> "$GITHUB_ENV"
          version_slug=$(printf '%s' "${{ inputs.base_ref }}" | tr -cd '[:alnum:]')
          echo "key=ppu-rust-v1-${version_slug}-${{ runner.os }}-${{ matrix.arch }}-py${{ matrix.python-version }}-cu${{ matrix.cuda-version }}-${image_id#sha256:}-$RUST_INPUT_HASH" >> "$GITHUB_OUTPUT"

      # 最终二进制只接受精确命中，不使用 restore-keys 回退，也不按提交 SHA 失效。
      - name: Restore Rust artifacts
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ppu-rust-artifacts
          key: ${{ steps.rust-key.outputs.key }}

      - name: Stage complete Rust cache
        if: steps.rust-cache.outputs.cache-hit == 'true'
        run: |
          shopt -s nullglob
          parsers=("$RUST_CACHE_DIR"/_rust_tool_parser*.so)
          if [[ -s "$RUST_CACHE_DIR/vllm-rs" && ${#parsers[@]} -eq 1 ]] && [[ -s "${parsers[0]}" ]]; then
            install -m 755 "$RUST_CACHE_DIR/vllm-rs" "${parsers[0]}" vllm/
            echo "Rust 缓存完整：由 setup.py 复用，跳过本地 Rust 编译。"
          else
            echo "::warning::Rust 缓存不完整，将从源码重新编译。"
          fi

      - name: Compute wheel version
        id: version
        env:
          TARGET_VERSION: ${{ inputs.base_ref }}
        run: |
          TARGET_VERSION="${TARGET_VERSION#v}"
          BUILD_DATE_COMPACT=$(date -u +%Y%m%d)
          HASH=$(git rev-parse --short HEAD)
          WHEEL_VERSION="${TARGET_VERSION}.dev${BUILD_DATE_COMPACT}+g${HASH}"
          echo "Wheel version: ${WHEEL_VERSION}"
          {
            echo "target_version=${TARGET_VERSION}"
            echo "wheel_version=${WHEEL_VERSION}"
            echo "artifact_name=ppu-wheels-${{ github.run_id }}"
          } >> "$GITHUB_OUTPUT"

      - name: Build wheel
        env:
          # 版本号经 workflow → 脚本 → docker -e → setup.py 四层传递，
          # 任一环节断掉会静默产出 setuptools_scm 推导版本，故下一步硬校验。
          VLLM_VERSION_OVERRIDE: ${{ steps.version.outputs.wheel_version }}
        run: |
          MAX_JOBS="$(nproc)"
          export MAX_JOBS
          export NVCC_THREADS=1
          export HOST_CCACHE_DIR="$RUNNER_TEMP/ppu-ccache"
          mkdir -p "${HOST_CCACHE_DIR}"
          bash scripts/ppu/build-ppu-wheel.sh \
            "${{ steps.version.outputs.target_version }}" \
            "${{ matrix.python-version }}" \
            "${{ matrix.cuda-version }}" \
            "${{ matrix.arch }}"

      # 容器以 root 写入 ccache 目录，chown 回 runner 用户，save 才能打包。
      - name: Fix ccache ownership for save
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/ppu-ccache" || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ppu-ccache
          key: ppu-ccache-${{ runner.os }}-cu13.0-sdk2.2.0-${{ inputs.pr_head_sha }}

      # 硬校验产物文件名中的版本段：断链时在这里响，而不是下游装错版本才发现。
      - name: Verify wheel version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.wheel_version }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::No wheel produced in dist/"
            exit 1
          fi
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "::error::Expected exactly one wheel, got ${#wheels[@]}: ${wheels[*]}"
            exit 1
          fi
          wheel_version=$(basename "${wheels[0]}" | cut -d- -f2)
          if [ "$wheel_version" != "$EXPECTED_VERSION" ]; then
            echo "::error::Built wheel version '$wheel_version' does not match expected '$EXPECTED_VERSION'"
            exit 1
          fi
          echo "Verified: ${wheels[0]}"

      # 只从本轮成功且版本正确的 wheel 提取；不缓存整个 wheel 或 Cargo target。
      - name: Extract Rust artifacts from wheel
        id: rust-artifacts
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          rm -rf "$RUST_CACHE_DIR"
          mkdir -p "$RUST_CACHE_DIR"
          if ! unzip -jo "${wheels[0]}" 'vllm/vllm-rs' 'vllm/_rust_tool_parser*.so' -d "$RUST_CACHE_DIR"; then
            echo "::warning::Wheel 未提供完整 Rust 产物，不保存缓存。"
            exit 0
          fi
          parsers=("$RUST_CACHE_DIR"/_rust_tool_parser*.so)
          if [[ -s "$RUST_CACHE_DIR/vllm-rs" && ${#parsers[@]} -eq 1 ]] && [[ -s "${parsers[0]}" ]]; then
            chmod 755 "$RUST_CACHE_DIR/vllm-rs" "${parsers[0]}"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Rust 产物为空或不唯一，不保存缓存。"
          fi

      - name: Save Rust artifacts
        if: steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-artifacts.outputs.ready == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ppu-rust-artifacts
          key: ${{ steps.rust-key.outputs.key }}

      # pytest 测试工具链随 wheel 一起产出：在出网正常的云 runner 上预下载,
      # 打进同一个 artifact 的 toolchain/ 子目录。area 端 download 后随 ci-wheel/
      # 进 Pod（/workspace/source/ci-wheel/toolchain/），deps 脚本先 --no-index
      # --find-links 离线装,规避 mirror 空页 / Pod 出网代理抖动;失败再回落索引。
      # best-effort：云端偶发拉取失败不阻断构建（Pod 侧本就有索引回落兜底）。
      # 5 个包与 ppu_install_dependency.sh 第 152 行一致;runner 与 Pod 同为
      # linux/x86_64/cp312,pip download 得到的 wheel 平台匹配。
      - name: Download test toolchain wheels
        continue-on-error: true
        run: |
          mkdir -p dist/toolchain
          python3 -m pip download --no-deps \
            pytest pytest-asyncio tblib pytest-shard pyyaml \
            -d dist/toolchain \
            -i https://pkg.flytiger-eco.com/artifactory/api/pypi/pypi_index/simple
          echo "---- toolchain wheels ----"
          ls -1 dist/toolchain/ || true

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          # dist/*.whl（主 wheel）+ dist/toolchain/*.whl；公共根 dist/ →
          # artifact 内为 <wheel> 与 toolchain/<wheel>，area 下载后目录结构一致。
          path: |
            dist/*.whl
            dist/toolchain/*.whl
          if-no-files-found: error
          overwrite: true
