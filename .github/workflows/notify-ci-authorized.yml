name: Notify PPU CI authorization

on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  notify:
    if: >-
      github.repository == 'flytiger-eco/vllm-for-sail' &&
      (github.event.label.name == 'ready' ||
       github.event.label.name == 'ready-run-all-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: ppu-ci-notify-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - name: Explain PPU CI commands
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_TRUSTED_USERS: ${{ vars.CI_TRUSTED_USERS }}
        run: python scripts/ci/ppu_ci_command.py notify
