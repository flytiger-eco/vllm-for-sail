# Builds the PR's PPU wheel, shared by the three areas.
name: Build PPU Wheel

on:
  workflow_call:
    outputs:
      artifact_name:
        description: "Name of the uploaded wheel artifact (for the caller's download-artifact)"
        value: ${{ jobs.build-wheel.outputs.artifact_name }}
      wheel_version:
        description: "Version of the built wheel"
        value: ${{ jobs.build-wheel.outputs.wheel_version }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-wheel:
    if: |
      github.repository == 'flytiger-eco/vllm-for-sail'
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      PPU_BUILD_IMAGE: pkg.flytiger-eco.com/docker_build/pytorch:ubuntu24.04-py312.06
    strategy:
      matrix:
        python-version: ["3.12"]
        cuda-version: ["13.0"]
        # arm64 needs a separate job (see PR #6).
        arch: [x86_64]
    outputs:
      wheel_version: ${{ steps.version.outputs.wheel_version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - name: Clean workspace (remove root-owned files from prior runs)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" alpine:3 \
            sh -c 'rm -rf /workspace/..?* /workspace/.[!.]* /workspace/*' || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # restore-keys falls back to the latest cache; a PR's first run misses.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ppu-ccache
          key: ppu-ccache-${{ runner.os }}-cu13.0-sdk2.2.0-${{ github.sha }}
          restore-keys: |
            ppu-ccache-${{ runner.os }}-cu13.0-sdk2.2.0-

      # Key on the image digest so a re-pushed tag invalidates the Rust cache.
      - name: Compute Rust cache key
        id: rust-key
        env:
          RUST_INPUT_HASH: ${{ hashFiles('rust/**', 'rust-toolchain.toml', 'tools/build_rust.py', 'build_rust.sh', 'setup.py', 'pyproject.toml', 'vllm/envs.py', 'requirements/build/*.txt', 'requirements/ppu.txt', 'requirements/common.txt', 'scripts/ppu/build-ppu-wheel.sh', '.github/workflows/build-ppu-wheel.yml') }}
        run: |
          test -n "$RUST_INPUT_HASH"
          docker pull "$PPU_BUILD_IMAGE"
          image_id=$(docker image inspect --format '{{.Id}}' "$PPU_BUILD_IMAGE")
          test -n "$image_id"
          echo "PPU_BUILD_IMAGE=$image_id" >> "$GITHUB_ENV"
          echo "RUST_CACHE_DIR=$RUNNER_TEMP/ppu-rust-artifacts" >> "$GITHUB_ENV"
          echo "key=ppu-rust-v1-v028-${{ runner.os }}-${{ matrix.arch }}-py${{ matrix.python-version }}-cu${{ matrix.cuda-version }}-${image_id#sha256:}-$RUST_INPUT_HASH" >> "$GITHUB_OUTPUT"

      # Exact hits only: no restore-keys and no commit SHA in the key.
      - name: Restore Rust artifacts
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ppu-rust-artifacts
          key: ${{ steps.rust-key.outputs.key }}

      - name: Stage complete Rust cache
        if: steps.rust-cache.outputs.cache-hit == 'true'
        run: |
          shopt -s nullglob
          parsers=("$RUST_CACHE_DIR"/_rust_tool_parser*.so)
          if [[ -s "$RUST_CACHE_DIR/vllm-rs" && ${#parsers[@]} -eq 1 ]] && [[ -s "${parsers[0]}" ]]; then
            install -m 755 "$RUST_CACHE_DIR/vllm-rs" "${parsers[0]}" vllm/
            echo "Rust cache is complete: reused by setup.py, skipping the local Rust build."
          else
            echo "::warning::Rust cache is incomplete; rebuilding from source."
          fi

      - name: Compute wheel version
        id: version
        env:
          TARGET_VERSION: "0.28.0"
        run: |
          BUILD_DATE_COMPACT=$(date -u +%Y%m%d)
          HASH=$(git rev-parse --short HEAD)
          WHEEL_VERSION="${TARGET_VERSION}.dev${BUILD_DATE_COMPACT}+g${HASH}"
          echo "Wheel version: ${WHEEL_VERSION}"
          {
            echo "wheel_version=${WHEEL_VERSION}"
            echo "artifact_name=wheel-py${{ matrix.python-version }}-cu${{ matrix.cuda-version }}-${{ matrix.arch }}-v0_28_0"
          } >> "$GITHUB_OUTPUT"

      - name: Build wheel
        env:
          # Passed via script -> docker -e -> setup.py; a break silently falls
          # back to the setuptools_scm version, so it is verified below.
          VLLM_VERSION_OVERRIDE: ${{ steps.version.outputs.wheel_version }}
        run: |
          MAX_JOBS="$(nproc)"
          export MAX_JOBS
          export NVCC_THREADS=1
          export HOST_CCACHE_DIR="$RUNNER_TEMP/ppu-ccache"
          mkdir -p "${HOST_CCACHE_DIR}"
          bash scripts/ppu/build-ppu-wheel.sh \
            "0.28.0" \
            "${{ matrix.python-version }}" \
            "${{ matrix.cuda-version }}" \
            "${{ matrix.arch }}"

      # The container writes ccache as root.
      - name: Fix ccache ownership for save
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/ppu-ccache" || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ppu-ccache
          key: ppu-ccache-${{ runner.os }}-cu13.0-sdk2.2.0-${{ github.sha }}

      - name: Verify wheel version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.wheel_version }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::No wheel produced in dist/"
            exit 1
          fi
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "::error::Expected exactly one wheel, got ${#wheels[@]}: ${wheels[*]}"
            exit 1
          fi
          wheel_version=$(basename "${wheels[0]}" | cut -d- -f2)
          if [ "$wheel_version" != "$EXPECTED_VERSION" ]; then
            echo "::error::Built wheel version '$wheel_version' does not match expected '$EXPECTED_VERSION'"
            exit 1
          fi
          echo "Verified: ${wheels[0]}"

      # Cache only the Rust binaries from the verified wheel.
      - name: Extract Rust artifacts from wheel
        id: rust-artifacts
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          rm -rf "$RUST_CACHE_DIR"
          mkdir -p "$RUST_CACHE_DIR"
          if ! unzip -jo "${wheels[0]}" 'vllm/vllm-rs' 'vllm/_rust_tool_parser*.so' -d "$RUST_CACHE_DIR"; then
            echo "::warning::Wheel does not contain complete Rust artifacts; not saving the cache."
            exit 0
          fi
          parsers=("$RUST_CACHE_DIR"/_rust_tool_parser*.so)
          if [[ -s "$RUST_CACHE_DIR/vllm-rs" && ${#parsers[@]} -eq 1 ]] && [[ -s "${parsers[0]}" ]]; then
            chmod 755 "$RUST_CACHE_DIR/vllm-rs" "${parsers[0]}"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Rust artifacts are empty or not unique; not saving the cache."
          fi

      - name: Save Rust artifacts
        if: steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-artifacts.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ppu-rust-artifacts
          key: ${{ steps.rust-key.outputs.key }}

      # Bundle the pytest toolchain so the Pod can install it offline (it falls
      # back to the index). Keep the list in sync with ppu_install_dependency.sh.
      - name: Download test toolchain wheels
        continue-on-error: true
        run: |
          mkdir -p dist/toolchain
          python3 -m pip download --no-deps \
            pytest pytest-asyncio tblib pytest-shard pyyaml \
            -d dist/toolchain \
            -i https://pkg.flytiger-eco.com/artifactory/api/pypi/pypi_index/simple
          echo "---- toolchain wheels ----"
          ls -1 dist/toolchain/ || true

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.python-version }}-cu${{ matrix.cuda-version }}-${{ matrix.arch }}-v0_28_0
          # Layout: <wheel> and toolchain/<wheel>.
          path: |
            dist/*.whl
            dist/toolchain/*.whl
          if-no-files-found: error
