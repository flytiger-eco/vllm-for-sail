# Nightly PPU 回归（N0）——对位上游 Buildkite NIGHTLY=1 定时全量构建中的
# nightly 性质 step（%N / torch_nightly）：kernels（3×%N）+ lora（%N）+
# models-language（2×%N + torch_nightly），共 3 个 area。
# 清单与判定口径见 scripts/ppu/nightly-tests-inventory.md。
# 纯 PR 性质 area（basic-correctness / engine 等）上游 PR 构建本就覆盖，
# 不在此复跑（单卡资源聚焦 PR 覆盖不到的 nightly 用例）。
#
# 触发：仅 schedule + 手动 dispatch（无 push/PR、无路径门禁——nightly 必全量）。
#   cron "0 18 * * *" = UTC 18:00 = 北京时间 02:00，与白天 PR 测试错峰。
#   注意：schedule 仅在仓库默认分支生效；其他分支用 workflow_dispatch 手动跑。
# 串行防抢卡（单卡 PPU 资源）：
#   - workflow 级 nightly-ppu-run：同一时间只允许一个 nightly run（排队不取消）
#   - matrix 级 max-parallel: 1：3 个 area 串行执行。
#   - 跨 workflow 互斥无需额外配置：PPU 整机仅一个 self-hosted runner，天然串行。
# 时长：timeout 沿用各 PR 版上限（总和 ~9h 为上限而非实际时长），首跑校准
name: Nightly PPU test

on:
  # [临时] 合并默认分支前的可见性/触发验证，验证通过后移除
  push:
    branches: [feat/gha-ppu-test]
    paths:
      - ".github/workflows/nightly-ppu.yml"
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-ppu-run
  cancel-in-progress: false

permissions:
  contents: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-vllm0.23.0-py312

jobs:
  # ==================== Nightly 全量（ 3 area ） ==================== #
  ppu-nightly-test:
    runs-on: [self-hosted, ppu]
    strategy:
      fail-fast: false # 单 area 失败不影响其余 area 排队执行
      max-parallel: 1 # 单卡 PPU：3 个 area 串行执行
      matrix:
        include:
          - {area: lora, timeout: 100, run_timeout: 90}
          - {area: models-language, timeout: 300, run_timeout: 290}
          - {area: kernels, timeout: 360, run_timeout: 350}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Clean workspace
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            ${{ env.PPU_BASE_IMAGE }} \
            bash -c "rm -rf /workspace/.??* /workspace/* 2>/dev/null; true"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run PPU ${{ matrix.area }} tests
        timeout-minutes: ${{ matrix.run_timeout }}
        env:
          AREA: ${{ matrix.area }}
          PPU_ARTIFACTORY_USER: ${{ secrets.PPU_ARTIFACTORY_USER }}
          PPU_ARTIFACTORY_PASSWORD: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}
        run: |
          docker run --rm \
            --privileged \
            --network host \
            --add-host=$(hostname):$(hostname -I | awk '{print $1}') \
            --device=/dev/alixpu_ctl \
            --device=/dev/alixpu \
            --ipc=host \
            --init \
            --shm-size=8g \
            --ulimit memlock=-1 \
            --ulimit stack=67108864 \
            -v ${{ github.workspace }}:/workspace \
            -v /nas_aisw:/nas_aisw \
            -e HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub \
            -e PPU_ARTIFACTORY_USER \
            -e PPU_ARTIFACTORY_PASSWORD \
            -e PPU_DEVICE_LABEL=OAM-810E \
            ${{ env.PPU_BASE_IMAGE }} \
            bash -c "
              cd /workspace && \
              bash scripts/ppu/ppu_install_dependency.sh && \
              bash scripts/ppu/test-area-ppu-${AREA}.sh
            "

      - name: Publish test summary
        if: always()
        env:
          AREA: ${{ matrix.area }}
        run: |
          f="test-results/summary.md"
          if [ -f "$f" ]; then
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Nightly PPU: ${AREA}"
              echo ""
              echo "summary.md not produced — the in-container script exited"
              echo "before its EXIT trap fired (see run log)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-nightly-${{ matrix.area }}-test-results
          path: test-results/
          if-no-files-found: warn

  # ==================== 聚合点 ==================== #
  nightly-finish:
    needs: [ppu-nightly-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 -c "
          import json, sys, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          failed = []
          for job, info in needs.items():
              result = info.get('result', 'unknown')
              print(f'{job}: {result}')
              if result not in ('success', 'skipped'):
                  failed.append(f'{job} ({result})')
          if failed:
              sep = ','
              print(f'Failed jobs: {sep.join(failed)}')
              sys.exit(1)
          print('All jobs completed successfully')
          "
