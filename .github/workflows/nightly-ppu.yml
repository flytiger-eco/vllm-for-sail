# 定时 PPU 回归——重量级 area 的兜底覆盖。
#
# 与 PR 门禁的分工（详见 scripts/ppu/docs/ppu-ci-usage.md）：
#   PR 自动触发档：attention / model-executor / entrypoints / samplers（约 14min）
#   PR 标签触发档（ppu-full）：其余 18 个重量级 area，不自动跑
#   本 workflow：把标签触发档的 18 个 area 连同 3 个 nightly-only area
#   （models-language / models-distributed / models-multimodal）定时补跑一遍，
#   保证即使没人打标签也有每日/每周的回归基线。
#   注：spec-decode 仅 workflow_dispatch 手动入口（依赖模型未入库），不在本档。
#
# 为什么拆两档 cron：area 之间必须串行（理由见下方 max-parallel）。
#   已标定的 4 个就已占 4h46min（kernels 2h14min + engine 1h32min +
#   models-basic 48min + entrypoints-llm 12min，数据源：批次 1 首跑报告），
#   全量连跑会一直占用到工作时段、把白天的 PR 快速集堵在队列里。故按时长拆分：
#     - 工作日夜间集：basic-correctness / entrypoints-llm / lora / models-basic
#       （已标定部分 1h 以内，另两个按 timeout 上限预留；worst-case ≈7h 已贴近
#       夜间窗口上限，不再往里加新 area）
#     - 周末集：engine / kernels / models-language + 批次 2 新增的 14 个未标定
#       area（含 nightly-only 的 models-distributed / models-multimodal；spec-decode
#       为 dispatch-only 不在此列）。周六 02:00 起跑，worst-case ≈43h 仍在周末
#       窗口内，首跑标定后再按实测时长在两档间回摆
#   cron 为 UTC：18:00 UTC = 次日 02:00 北京时间，故 `0-4` = 周一~周五，
#   `5` = 周六。schedule 仅在仓库默认分支生效，其他分支用 workflow_dispatch。
#
# 串行：workflow 级 concurrency（排队不取消）+ matrix max-parallel: 1。
#   抢卡已不是理由：worker Pod 去掉 privileged 后，PPU device plugin 只向
#   容器注入分配到的 nproc_per_node 张卡并重编号为 0..N-1（实测见
#   各 test-area-ppu-*.yml 的 container_options 注释），卡是真隔离的；
#   且 K8s extended resource（alibabacloud.com/ppu）记账不超卖，超出节点
#   容量的 Pod 会 Pending 排队。
#   真正的理由是源码暂存目录冲突：ppu-distributed-action 的 NAS 暂存路径是
#   /wl_nas/devops/${RUN_ID}-${ATTEMPT}/${GITHUB_JOB}/{stage,source.tar.gz}，
#   只含 job key，matrix 各 leg 共享同一个值。并行时多个 leg 会往同一目录
#   cp -a + tar czf + rm -rf，tar 读到被并发改写的文件即报
#   "file changed as we read it" 并 exit 1（打包步骤跑在 bash -e 下）。
#   实测于 run 34325180549（设备探针 workflow 的两个 matrix leg）。
#   各 test-area-ppu-*.yml 是独立 workflow、独立 job key，不受此限，可并行。
name: Nightly PPU test

on:
  schedule:
    - cron: "0 18 * * 0-4" # 周一~周五 02:00（北京）：短 area 夜间集
    - cron: "0 18 * * 5" # 周六 02:00（北京）：长 area 周末集
  workflow_dispatch:
    inputs:
      area_set:
        description: "跑哪一档：auto(按 cron 判定) | nightly(短) | weekend(长) | all"
        type: choice
        default: auto
        options: [auto, nightly, weekend, all]

concurrency:
  group: nightly-ppu-run
  cancel-in-progress: false

permissions:
  contents: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-vllm0.23.0-py312

jobs:
  # ==================== 选择本次要跑的 area 档 ==================== #
  select-areas:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick area set
        id: pick
        env:
          # schedule 事件带 cron 表达式；dispatch 事件为空
          CRON: ${{ github.event.schedule }}
          AREA_SET: ${{ inputs.area_set || 'auto' }}
        run: |
          # run_timeout = in-pod 上限（已标定的按首跑实测收紧：entrypoints-llm
          # 11m34s → 50，models-basic 48m07s → 110；basic-correctness / lora /
          # models-language 与批次 2 的 14 个新 area 未标定，暂留 PR 版上限 90，
          # 首次定时跑完后回写）。
          # timeout = job 上限 = run_timeout + 25，含 K8s 调度 + 镜像准备开销
          #（实测约 210s），与各 test-area-ppu-*.yml 取值一致。
          # nproc = 本 area 实际需要的 PPU 卡数，与各 test-area-ppu-*.yml 的
          # nproc_per_node 一致（依据是脚本里 _run_step 的 shards 与
          # CUDA_VISIBLE_DEVICES 用法：lora 的 lora_full 跑 4 shards（每 shard
          # 独占 1 卡），e2e-integration / lm-eval 各 4 卡，basic-correctness 的
          # distributed 内部 TP=2，compile / distributed / expert-parallelism /
          # model-runner-v2 / models-distributed / weight-loading 各 2 卡，
          # models-language 的 extra_standard / hybrid 各 2 shards，其余均单卡）。
          nightly='[{"area":"basic-correctness","nproc":2,"timeout":115,"run_timeout":90},{"area":"entrypoints-llm","nproc":1,"timeout":75,"run_timeout":50},{"area":"lora","nproc":4,"timeout":115,"run_timeout":90},{"area":"models-basic","nproc":1,"timeout":135,"run_timeout":110}]'
          weekend='[{"area":"engine","nproc":1,"timeout":315,"run_timeout":290},{"area":"kernels","nproc":1,"timeout":375,"run_timeout":350},{"area":"models-language","nproc":2,"timeout":315,"run_timeout":290},{"area":"benchmarks","nproc":1,"timeout":115,"run_timeout":90},{"area":"compile","nproc":2,"timeout":115,"run_timeout":90},{"area":"cuda","nproc":1,"timeout":115,"run_timeout":90},{"area":"distributed","nproc":2,"timeout":115,"run_timeout":90},{"area":"e2e-integration","nproc":4,"timeout":115,"run_timeout":90},{"area":"expert-parallelism","nproc":2,"timeout":115,"run_timeout":90},{"area":"lm-eval","nproc":4,"timeout":115,"run_timeout":90},{"area":"misc","nproc":1,"timeout":115,"run_timeout":90},{"area":"model-runner-v2","nproc":2,"timeout":115,"run_timeout":90},{"area":"models-distributed","nproc":2,"timeout":115,"run_timeout":90},{"area":"models-multimodal","nproc":1,"timeout":115,"run_timeout":90},{"area":"pytorch","nproc":1,"timeout":115,"run_timeout":90},{"area":"quantization","nproc":1,"timeout":115,"run_timeout":90},{"area":"weight-loading","nproc":2,"timeout":115,"run_timeout":90}]'
          case "${AREA_SET}" in
            nightly) sel="${nightly}" ;;
            weekend) sel="${weekend}" ;;
            all)     sel="$(python3 -c "import json,sys;print(json.dumps(json.loads(sys.argv[1])+json.loads(sys.argv[2])))" "${nightly}" "${weekend}")" ;;
            *)
              # auto：周六那条 cron 跑长 area 集，其余跑短 area 集
              if [ "${CRON}" = "0 18 * * 5" ]; then sel="${weekend}"; else sel="${nightly}"; fi
              ;;
          esac
          echo "[select] area_set=${AREA_SET} cron='${CRON}'"
          echo "${sel}" | python3 -c "import json,sys;print('[select] areas:', ', '.join(a['area'] for a in json.load(sys.stdin)))"
          echo "matrix=${sel}" >> "$GITHUB_OUTPUT"

  # ==================== 重量级 area 定时补跑 ==================== #
  ppu-nightly-test:
    needs: [select-areas]
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    strategy:
      fail-fast: false # 单 area 失败不影响其余 area 排队执行
      max-parallel: 1 # 必须串行（NAS 暂存目录冲突），理由见文件头「串行」段
      matrix:
        include: ${{ fromJson(needs.select-areas.outputs.matrix) }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      # checkout 是 action 源码自动投递的前提：action 把 $GITHUB_WORKSPACE 打包
      # 暂存到 NAS，worker Pod 内解压到 source_dir（默认 /workspace/source）。
      # fetch-depth: 1 缩小 .git，减少打包体积与耗时。
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 为什么绕 base64：ppu-distributed-action 的「校验 inputs」步骤把
      # inputs.command 直接文本插值进 `if [ -z "<command>" ]`，多行/含引号的
      # command 会引发 shell syntax error。base64 后是单行且只含
      # [A-Za-z0-9+/=]，被那对双引号整段吞掉，安全无副作用。
      # 脚本本身与 matrix 无关（area 名经 extra_env 的 AREA 下发），各 leg 复用。
      - name: Build in-pod runner payload
        id: payload
        shell: bash
        run: |
          cat > /tmp/ppu-run.sh <<'RUNEOF'
          #!/bin/bash
          set -euo pipefail
          cd /workspace/source
          echo "[k8s-nightly] area=${AREA} node=${NODE_NAME:-unknown}"
          bash scripts/ppu/ppu_install_dependency.sh
          bash scripts/ppu/test-area-ppu-${AREA}.sh
          RUNEOF
          # 语法自检：runner 上早失败好过在 Pod 里烧一次调度
          bash -n /tmp/ppu-run.sh
          # tr 而非 base64 -w0：后者是 GNU 专有
          echo "b64=$(base64 < /tmp/ppu-run.sh | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Run PPU ${{ matrix.area }} tests
        id: ppu
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          # 单机；nproc_per_node = 本 area 实际需要的 PPU 卡数（见 select-areas）
          nnodes: 0
          nproc_per_node: ${{ matrix.nproc }}
          node_selector: board-type=OAM-810E
          # /nas_aisw、/mnt/wl_nas 由 action 默认挂载，无需传 host_volumes
          image: ${{ env.PPU_BASE_IMAGE }}
          namespace: ppu-sched
          timeout_minutes: ${{ matrix.run_timeout }}
          cleanup_policy: always
          # 刻意不开 privileged：特权容器会拿到宿主机全量 /dev，绕过 PPU device
          # plugin 的设备注入。对照实测（run 34325790779，同节点同样申请 2 卡）：
          # privileged 下 /dev 有 16 个 alixpu_ppu*、ppu-smi 列 16 张、
          # torch device_count=16；unprivileged 下只注入分配到的 2 个设备节点
          # 且重编号为 0..N-1（物理 0/3 → 容器内 0/1）、device_count=2。后者正合
          # 各 area 脚本 CUDA_VISIBLE_DEVICES=0..N-1 的相对语义，且是 area 之间
          # 能并行的前提。host_ipc/shm_size 对位 docker --ipc=host --shm-size=8g；
          # docker 版的 --ulimit memlock=-1 无 K8s 等价物、unprivileged 下亦无法
          # 自行提升，如遇 pinned memory 类失败需集群侧放宽 LimitMEMLOCK。
          container_options: |
            host_ipc: true
            shm_size: "8Gi"
          # extra_env 以逗号分隔 KEY=VAL，值内勿含逗号
          # summary.md 经 NAS 回传：worker Pod 挂 /mnt/wl_nas、runner 容器挂
          # /wl_nas（同一 NAS）；matrix 各 leg 的 GITHUB_JOB 相同，以 area 名
          # 再分一层目录，避免互相覆盖。
          extra_env: >-
            HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_DEVICE_LABEL=OAM-810E,AREA=${{ matrix.area }},PPU_SUMMARY_NAS_DIR=/mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/${{ matrix.area }},PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }}
          # 必须单行、不含双引号，见上面 payload 步骤注释
          command: echo ${{ steps.payload.outputs.b64 }} | base64 -d > /tmp/ppu-run.sh && bash /tmp/ppu-run.sh

      # 用例明细：脚本在 Pod 内把 per-unit 统计表经 NAS 回传（PPU_SUMMARY_NAS_DIR，
      # 路径含 matrix area 隔离），此处读回渲染；NAS 读不到时回退为作业元信息表，
      # 明细仍可从 job 日志查看（action 全量透传 Pod stdout）。
      - name: Publish test summary
        if: always()
        env:
          AREA: ${{ matrix.area }}
          OUT_JOB_NAME: ${{ steps.ppu.outputs.job_name }}
          OUT_JOB_STATUS: ${{ steps.ppu.outputs.job_status }}
          OUT_DURATION: ${{ steps.ppu.outputs.duration_seconds }}
          OUT_TASK_PODS: ${{ steps.ppu.outputs.task_pods }}
          OUT_LOG_ARTIFACT: ${{ steps.ppu.outputs.log_artifact_name }}
        run: |
          NAS_SUM="/wl_nas/devops/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${GITHUB_JOB}/${AREA}/summary.md"
          {
            if [ -f "${NAS_SUM}" ]; then
              cat "${NAS_SUM}"
              echo ""
              echo "<sub>nproc: ${{ matrix.nproc }} · K8s job \`${OUT_JOB_NAME:-<empty>}\` · ${OUT_JOB_STATUS:-<empty>} · ${OUT_DURATION:-<empty>}s · pods: \`${OUT_TASK_PODS:-<empty>}\` · log: \`${OUT_LOG_ARTIFACT:-<empty>}\`</sub>"
            else
              echo "### Nightly PPU: ${AREA} (K8s)"
              echo ""
              echo "> summary.md 未回传（Pod 内脚本在 EXIT trap 前退出或 NAS 不可写），仅显示作业元信息；用例明细见上方 job 日志。"
              echo ""
              echo "| item | value |"
              echo "|---|---|"
              echo "| nproc_per_node | ${{ matrix.nproc }} |"
              echo "| image | \`${PPU_BASE_IMAGE}\` |"
              echo "| job_name | ${OUT_JOB_NAME:-<empty>} |"
              echo "| job_status | ${OUT_JOB_STATUS:-<empty>} |"
              echo "| duration_seconds | ${OUT_DURATION:-<empty>} |"
              echo "| task_pods | ${OUT_TASK_PODS:-<empty>} |"
              echo "| log_artifact | ${OUT_LOG_ARTIFACT:-<empty>} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ==================== 聚合点 ==================== #
  nightly-finish:
    needs: [select-areas, ppu-nightly-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 -c "
          import json, sys, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          failed = []
          for job, info in needs.items():
              result = info.get('result', 'unknown')
              print(f'{job}: {result}')
              if result not in ('success', 'skipped'):
                  failed.append(f'{job} ({result})')
          if failed:
              sep = ','
              print(f'Failed jobs: {sep.join(failed)}')
              sys.exit(1)
          print('All jobs completed successfully')
          "
