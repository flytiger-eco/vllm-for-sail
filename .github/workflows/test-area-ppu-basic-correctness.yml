# Aone CI `.aoneci/test-area-ppu-basic-correctness.yaml` 的 GitHub Actions 移植版
# 结构：
#   check-changes — 路径变更门禁（对位 Aone diff-guard）
#   ppu-basic-correctness-test — CPU runner 上用 ppu-distributed-action 拉起
#     PPU Pod，Pod 内装依赖 + 跑 pytest
#   ppu-test-finish — 分支保护聚合点
#
# 执行形态：本 area 由 self-hosted PPU runner + docker run 切到 K8s 调度 ——
# job 跑在 CPU runner group，flytiger-eco/ppu-distributed-action 按
# nnodes/nproc_per_node 在 PPU 节点创建 Pod、流式回传 worker-0 日志。
# nnodes=0 为单机模式（不建 PodGroup/Headless Service），nproc_per_node=2
# 满足本 area multi 段测试内部 TP=2 的用卡需求。
#
# 代码投递：Pod 只有 image + host_volumes，拿不到 runner 工作区。故 runner
# checkout 后把工作区 stage 到 NAS 上的共用目录（Stage 步骤按
# PPU_CI_STAGE_CANDIDATES 次序探测可写根目录，结果写回 PPU_CI_WS），
# Pod 挂载同一宿主机路径后 cd 进去执行；产物 test-results/ 由 runner
# 从该目录反向取回后上传，作业结束删除该目录。
#
# 探测而非写死路径的原因：本集群 ARC 用 k8s-novolume hook（runner pod 与
# job 容器无共享卷），job 容器里 /mnt/wl_nas 并不存在、且无权在 /mnt
# 下新建。哪个 NAS 挂载点对 job 容器可见可写只能运行时知道，故 Stage
# 步骤自带环境盘点输出，全部候选都不可用时直接 ::error 报出它看到的现状。
#
# 前置（集群侧，非本仓库可控）：PPU 节点已预拉 ${PPU_BASE_IMAGE}，
# CPU runner 与 PPU 节点看到的是同一份 NAS 导出。
#
# 测试选集见 scripts/ppu/test-area-ppu-basic-correctness.sh，
name: Basic Correctness Test (PPU)

on:
  push:
    branches: [feat/gha-ppu-test]
    paths:
      - ".github/workflows/test-area-ppu-basic-correctness.yml"
      - "scripts/ppu/ppu_install_dependency.sh"
      - "scripts/ppu/test-area-ppu-basic-correctness.sh"
      - "tests/basic_correctness/**"
      - "vllm/*"
  pull_request:
    branches: [feat/gha-ppu-test]
  workflow_dispatch:

concurrency:
  group: test-area-ppu-basic-correctness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-vllm0.23.0-py312
  PPU_NAMESPACE: ppu-sched
  # 板卡硬约束：与脚本里 PPU_DEVICE_LABEL=OAM-810E 的用例快照保持一致
  PPU_NODE_SELECTOR: board-type=OAM-810E
  # /nas_aisw = 模型/HF 缓存；/mnt/wl_nas = 通用 NAS（两者都挂给 Pod，
  # 代码投递目录在哪一个由 Stage 步骤探测得出）
  PPU_HOST_VOLUMES: /nas_aisw:/nas_aisw,/mnt/wl_nas:/mnt/wl_nas
  # 代码投递候选根目录，按序探测可写性（空格分隔）
  PPU_CI_STAGE_CANDIDATES: /nas_aisw/gha-ci/vllm-for-sail /mnt/wl_nas/gha-ci/vllm-for-sail
  # 本 run 专属目录名；完整路径 PPU_CI_WS 由 Stage 步骤写入 GITHUB_ENV
  PPU_CI_RUN_TAG: basic-correctness-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # ==================== 变更检查 ==================== #
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      changes_exist: ${{ steps.decide.outputs.changes_exist }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 仅 PR 用 dorny/paths-filter
      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        with:
          filters: |
            ppu_code:
              - ".github/workflows/test-area-ppu-basic-correctness.yml"
              - "scripts/ppu/ppu_install_dependency.sh"
              - "scripts/ppu/test-area-ppu-basic-correctness.sh"
              - "tests/basic_correctness/**"
              - "vllm/*"

      - name: Decide whether to run tests
        id: decide
        env:
          FILTER_HIT: ${{ steps.filter.outputs.ppu_code }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # PR：按路径过滤结果决定
            echo "changes_exist=${FILTER_HIT:-false}" >> $GITHUB_OUTPUT
          else
            # push / 手动触发：必跑（push 已被 on.push.paths 触发级过滤）
            echo "changes_exist=true" >> $GITHUB_OUTPUT
          fi

  # ==================== PPU Basic Correctness  ==================== #
  ppu-basic-correctness-test:
    needs: [check-changes]
    if: needs.check-changes.outputs.changes_exist == 'true'
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 100
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pod 侧只能看到 host_volumes，故把工作区投递到两边共用的 NAS 路径。
      # 不投递 .git（244 MB 全是小文件，NFS 上拷贝极慢）：容器内既不构建
      # wheel 也不靠 setuptools-scm 推导版本号（vllm/_version.py 由
      # ppu_install_dependency.sh 从镜像 site-packages 拷入），无 git 依赖。
      - name: Stage workspace to NAS
        shell: bash
        run: |
          set -uo pipefail
          echo "========== [probe] job container view =========="
          echo "[probe] user=$(id -un 2>/dev/null || echo '?') uid=$(id -u) gid=$(id -g)"
          for p in / /mnt /nas_aisw /mnt/wl_nas; do
            echo "[probe] ${p}: $(ls -ld "${p}" 2>&1 | head -1)"
          done
          echo "[probe] nfs/nas mounts:"
          df -hT 2>/dev/null | grep -iE "nfs|nas|Filesystem" || echo "[probe] (none)"

          echo "========== [stage] pick a writable shared root =========="
          ws=""
          for root in ${PPU_CI_STAGE_CANDIDATES}; do
            if mkdir -p "${root}/${PPU_CI_RUN_TAG}" 2>/dev/null \
               && [ -w "${root}/${PPU_CI_RUN_TAG}" ]; then
              ws="${root}/${PPU_CI_RUN_TAG}"
              echo "[stage] usable: ${root}"
              break
            fi
            echo "[stage] NOT usable: ${root}"
          done
          if [ -z "${ws}" ]; then
            echo "::error::no writable shared dir in this job container (tried:" \
                 "${PPU_CI_STAGE_CANDIDATES}). ARC 用 k8s-novolume hook，代码投递" \
                 "要求 NAS 必须挂入 job 容器——它实际看到什么见上方 [probe] 输出"
            exit 1
          fi
          echo "PPU_CI_WS=${ws}" >> "${GITHUB_ENV}"

          # 兜底清理：cleanup 步骤因 root 属主文件失败时留下的历史目录
          find "$(dirname "${ws}")" -maxdepth 1 -mindepth 1 -type d -mtime +1 \
            -exec rm -rf {} + 2>/dev/null || true
          tar -cf - --exclude=./.git . | tar -xf - -C "${ws}"
          echo "[stage] ${ws} -> $(du -sh "${ws}" | cut -f1)"

      - name: Run PPU basic correctness tests
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          nnodes: 0
          nproc_per_node: 2
          node_selector: ${{ env.PPU_NODE_SELECTOR }}
          host_volumes: ${{ env.PPU_HOST_VOLUMES }}
          image: ${{ env.PPU_BASE_IMAGE }}
          namespace: ${{ env.PPU_NAMESPACE }}
          timeout_minutes: 90
          # always：失败 Pod 若滞留会一直占着 2 张卡，挡住后续 run
          cleanup_policy: always
          extra_env: "HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_DEVICE_LABEL=OAM-810E,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }}"
          # 每行以 ';' 收尾而非依赖换行：action 若把多行 command 折成单行仍成立。
          # /etc/hosts 补一条自身记录 = 原 docker --add-host（Ray/vLLM 要能把
          # hostname 解析成本机 IP）。remount /dev/shm + ulimit 是原 docker
          # --shm-size=8g / --ulimit memlock=-1 / stack=64M 的替代：K8s pod spec
          # 无此类字段，privileged 下（有 CAP_SYS_RESOURCE）可从容器内自提，
          # 非 privileged 时静默跳过。shm 必需：MessageQueue 环形缓冲区
          # 默认 24MB x 10 块 ≈ 240MB，超过容器 /dev/shm 默认 64MB 会报
          # ENOSPC 或 SIGBUS。随后一行把实际拿到的额度打印出来供首跑定性。
          # 末尾 chmod 让 runner（非 root）能取回产物并删掉 Pod 以 root 写下的文件。
          command: |
            cd ${{ env.PPU_CI_WS }} || exit 1 ;
            echo "[pod] host=$(hostname) node=$NODE_NAME rank=$RANK nproc=$NPROC_PER_NODE" ;
            echo "$(hostname -i | awk '{print $1}') $(hostname)" >> /etc/hosts || true ;
            mount -o remount,size=8G /dev/shm 2>/dev/null || true ;
            ulimit -l unlimited 2>/dev/null || true ;
            ulimit -s 65536 2>/dev/null || true ;
            echo "[pod] user=$(id -un) memlock=$(ulimit -l) stack=$(ulimit -s) shm=$(df -h /dev/shm | tail -1)" ;
            rc=0 ;
            bash scripts/ppu/ppu_install_dependency.sh || rc=$? ;
            if [ "$rc" -eq 0 ]; then bash scripts/ppu/test-area-ppu-basic-correctness.sh || rc=$? ; fi ;
            chmod -R a+rwX . 2>/dev/null || true ;
            echo "[pod] exit rc=$rc" ;
            exit "$rc"

      - name: Collect test results from NAS
        if: always()
        run: |
          ws="${PPU_CI_WS:-}"
          if [ -z "$ws" ]; then
            echo "::warning::PPU_CI_WS unset — staging never succeeded, nothing to collect"
          elif [ -d "$ws/test-results" ]; then
            mkdir -p test-results
            cp -r "$ws/test-results/." test-results/
            ls -l test-results
          else
            echo "::warning::no test-results under $ws — the in-container script" \
                 "exited before its EXIT trap fired, or the Pod never started"
          fi

      - name: Publish test summary
        if: always()
        run: |
          f="test-results/summary.md"
          if [ -f "$f" ]; then
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Basic Correctness Test (PPU)"
              echo ""
              echo "summary.md not produced — the in-container script exited"
              echo "before its EXIT trap fired (see 'Run PPU basic correctness"
              echo "tests' log)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-basic-correctness-test-results
          path: |
            test-results/
          if-no-files-found: warn

      - name: Clean up NAS workspace
        if: always()
        run: |
          ws="${PPU_CI_WS:-}"
          [ -n "$ws" ] || exit 0
          rm -rf "$ws" || echo "::warning::failed to remove $ws (root-owned" \
            "leftovers) — next run's stale-dir sweep will retry"

  # ==================== 聚合点 ==================== #
  ppu-test-finish:
    needs: [check-changes, ppu-basic-correctness-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 -c "
          import json, sys, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          failed = []
          for job, info in needs.items():
              result = info.get('result', 'unknown')
              print(f'{job}: {result}')
              if result not in ('success', 'skipped'):
                  failed.append(f'{job} ({result})')
          if failed:
              sep = ','
              print(f'Failed jobs: {sep.join(failed)}')
              sys.exit(1)
          print('All jobs completed successfully')
          "
