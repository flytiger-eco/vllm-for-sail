# Aone CI `.aoneci/test-area-ppu-basic-correctness.yaml` 的 GitHub Actions 移植版
# 结构：
#   check-changes — 路径变更门禁（对位 Aone diff-guard）
#   ppu-stage     — self-hosted PPU runner 上 checkout + 投递代码到 NAS（零占卡）
#   ppu-basic-correctness-test — CPU runner 上用 ppu-distributed-action 拉起
#     PPU Pod，Pod 内装依赖 + 跑 pytest（真正吃卡的一段）
#   ppu-collect   — self-hosted PPU runner 上取回产物、上传、清理 NAS
#   ppu-test-finish — 分支保护聚合点
#
# 执行形态：本 area 从 self-hosted PPU runner + docker run 切到 K8s 调度。
# nnodes=0 为单机模式（不建 PodGroup/Headless Service），nproc_per_node=2
# 满足本 area multi 段测试内部 TP=2 的用卡需求。
#
# 为什么还留着 self-hosted runner：Pod 只有 image + host_volumes，拿不到 runner
# 工作区，代码必须走一个两边都能看到的中转。而 2026-08-31 冒烟实测确认：
#   - CPU runner 的 job 容器里没有任何 NAS（ARC 用 k8s-novolume hook，只挂了
#     kubectl 的 hostPath），所以 CPU runner 写不进 NAS；
#   - Pod 内 github.com DNS 能解析但 TCP 超时，所以 Pod 也没法自己 git clone。
# 于是让 self-hosted runner（就在 PPU 机器上，既能访问 github 又挂着 /nas_aisw）
# 只做 checkout + 拷 NAS + 取回产物 —— 零占卡、几十秒，吃卡的测试跑在 K8s Pod 里。
# 集群侧若后续给 job 容器挂上 NAS（改 action 仓库的 hook-extension-cpu
# ConfigMap），ppu-stage / ppu-collect 两个 job 可以直接删掉，中间那个 job 不用动。
#
# 已知能力回退：Pod 非 privileged，memlock 只有 64KB 且提不上去（K8s pod spec
# 无 ulimit 字段），原 docker `--ulimit memlock=-1` 没有等价物。若测试因 pinned
# memory / RDMA 注册失败，需要集群侧给 pod 加 securityContext。
# 已确认不再是问题的：/dev/shm 由 submit.sh 挂成 emptyDir medium=Memory
# sizeLimit=64Gi，比原来 `--shm-size=8g` 更宽。
#
# 抢卡风险：其余 9 个 area 仍在 self-hosted runner 上跑 docker run，本 area 的
# Pod 与它们不再由"单 runner 天然串行"隔开，可能同时用卡。若出现"96 GiB free
# 但分配失败"这类虚假 OOM，需要重新引入跨 workflow 的共享并发组。
#
# 测试选集见 scripts/ppu/test-area-ppu-basic-correctness.sh，
name: Basic Correctness Test (PPU)

on:
  push:
    branches: [feat/gha-ppu-test]
    paths:
      - ".github/workflows/test-area-ppu-basic-correctness.yml"
      - "scripts/ppu/ppu_install_dependency.sh"
      - "scripts/ppu/test-area-ppu-basic-correctness.sh"
      - "tests/basic_correctness/**"
      - "vllm/*"
  pull_request:
    branches: [feat/gha-ppu-test]
  workflow_dispatch:

concurrency:
  group: test-area-ppu-basic-correctness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-vllm0.23.0-py312
  PPU_NAMESPACE: ppu-sched
  # 板卡硬约束：与脚本里 PPU_DEVICE_LABEL=OAM-810E 的用例快照保持一致
  PPU_NODE_SELECTOR: board-type=OAM-810E
  # Pod 侧挂载（hostPath）。左侧是宿主机路径、右侧是容器内路径 —— wl_nas 这块
  # 盘在宿主机上叫 /wl_nas，容器内习惯挂到 /mnt/wl_nas（owner 2026-08-31 指正）。
  # /nas_aisw 同时承载模型权重、HF 缓存与代码投递目录
  PPU_HOST_VOLUMES: /nas_aisw:/nas_aisw,/wl_nas:/mnt/wl_nas
  # 代码投递根目录：self-hosted runner 与 PPU 节点看到的是同一份导出
  PPU_CI_STAGE_ROOT: /nas_aisw/gha-ci/vllm-for-sail
  PPU_CI_RUN_TAG: basic-correctness-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # ==================== 变更检查 ==================== #
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      changes_exist: ${{ steps.decide.outputs.changes_exist }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 仅 PR 用 dorny/paths-filter
      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        with:
          filters: |
            ppu_code:
              - ".github/workflows/test-area-ppu-basic-correctness.yml"
              - "scripts/ppu/ppu_install_dependency.sh"
              - "scripts/ppu/test-area-ppu-basic-correctness.sh"
              - "tests/basic_correctness/**"
              - "vllm/*"

      - name: Decide whether to run tests
        id: decide
        env:
          FILTER_HIT: ${{ steps.filter.outputs.ppu_code }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # PR：按路径过滤结果决定
            echo "changes_exist=${FILTER_HIT:-false}" >> $GITHUB_OUTPUT
          else
            # push / 手动触发：必跑（push 已被 on.push.paths 触发级过滤）
            echo "changes_exist=true" >> $GITHUB_OUTPUT
          fi

  # ==================== 代码投递（零占卡）==================== #
  ppu-stage:
    needs: [check-changes]
    if: needs.check-changes.outputs.changes_exist == 'true'
    runs-on: [self-hosted, ppu]
    timeout-minutes: 20
    outputs:
      ws: ${{ steps.stage.outputs.ws }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 不投递 .git（244 MB 全是小文件，NFS 上拷贝极慢）：容器内既不构建
      # wheel 也不靠 setuptools-scm 推导版本号（vllm/_version.py 由
      # ppu_install_dependency.sh 从镜像 site-packages 拷入），无 git 依赖。
      # 也排除 test-results：那是上一个 run 的 collect job 留在工作区里的。
      - name: Stage workspace to NAS
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          ws="${PPU_CI_STAGE_ROOT}/${PPU_CI_RUN_TAG}"
          rm -rf "${ws}"
          mkdir -p "${ws}"
          tar -cf - --exclude=./.git --exclude=./test-results . | tar -xf - -C "${ws}"
          echo "ws=${ws}" >> "$GITHUB_OUTPUT"
          echo "[stage] ${ws} -> $(du -sh "${ws}" | cut -f1)"

      # 兜底清理：run 被取消时 collect job 不会执行，目录会留在 NAS 上
      - name: Sweep stale staging dirs
        if: always()
        shell: bash
        run: |
          find "${PPU_CI_STAGE_ROOT}" -maxdepth 1 -mindepth 1 -type d -mtime +1 \
            -exec rm -rf {} + 2>/dev/null || true

  # ==================== PPU Basic Correctness ==================== #
  ppu-basic-correctness-test:
    needs: [check-changes, ppu-stage]
    if: needs.check-changes.outputs.changes_exist == 'true'
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    # 含 Pod 调度 + 镜像准备开销（冒烟实测约 210s），比 pod 自身超时留足余量
    timeout-minutes: 110
    steps:
      # owner 指出 NAS 在宿主机上的路径是 /wl_nas（不是 /mnt/wl_nas）。而上次
      # stage 步骤在 job 容器里只探了 /nas_aisw 与 /mnt/wl_nas 两个候选，
      # /wl_nas 从来没试过。若它在 job 容器里就可写，代码可以由 CPU runner
      # 直接投递，ppu-stage / ppu-collect 两个 job 都能删掉。这一步只记录现状，
      # 不参与成败判定。
      - name: Probe job-container NAS visibility (non-fatal)
        continue-on-error: true
        shell: bash
        run: |
          echo "user=$(id -un) uid=$(id -u)"
          for d in /wl_nas /nas_aisw /mnt/wl_nas; do
            if [ -d "${d}" ]; then
              echo "${d}: exists, $(ls "${d}" 2>/dev/null | wc -l) entries"
              if touch "${d}/.ci-write-probe" 2>/dev/null; then
                echo "  -> writable YES（可直接投递，两个 self-hosted job 可删）"
                rm -f "${d}/.ci-write-probe"
              else
                echo "  -> writable NO"
              fi
            else
              echo "${d}: absent"
            fi
          done
          df -hT 2>/dev/null | grep -Ei 'nfs|nas' \
            || echo "job 容器内没有任何 nfs/nas 挂载"

      # 为什么绕 base64：action.yml 的「校验 inputs」步骤把 ${{ inputs.command }}
      # 直接文本插值进 shell —— if [ -z "<command>" ]。多行 command 被粘进那对
      # 双引号里，引号奇偶错乱后裸括号会引发 syntax error，且落在引号外的
      # $(...) 会在 runner 上被真实执行。base64 后是单行且只含 [A-Za-z0-9+/=]，
      # 被那对双引号整段吞掉，既不解析也不执行。引号界定符的 heredoc 还保证
      # $(...) 不在 runner 侧展开，全部留到 Pod 里才求值。
      - name: Build pod payload
        id: payload
        shell: bash
        run: |
          cat > /tmp/run-area.sh <<'AREA'
          #!/bin/bash
          cd "${CI_WS}" || exit 1
          echo "[pod] host=$(hostname) node=${NODE_NAME} nproc=${NPROC_PER_NODE} user=$(id -un)"
          echo "[pod] shm=$(df -h /dev/shm | tail -1)"
          echo "[pod] memlock=$(ulimit -l)KB stack=$(ulimit -s)KB"
          # 原 docker --add-host 的替代：单机模式不建 Headless Service，Pod 自己的
          # hostname 在集群 DNS 里查不到，而 Ray/vLLM 要能把它解析成本机 IP
          echo "$(hostname -i | awk '{print $1}') $(hostname)" >> /etc/hosts || true
          rc=0
          bash scripts/ppu/ppu_install_dependency.sh || rc=$?
          if [ "${rc}" -eq 0 ]; then
            bash scripts/ppu/test-area-ppu-basic-correctness.sh || rc=$?
          fi
          # Pod 内是 root，产物默认 root 属主；放开权限让 self-hosted runner
          # （非 root）能取回并删除
          chmod -R a+rwX . 2>/dev/null || true
          echo "[pod] exit rc=${rc}"
          exit "${rc}"
          AREA
          # 语法自检：在 runner 上早失败，好过烧一次 Pod 调度
          bash -n /tmp/run-area.sh
          # tr 而非 base64 -w0：后者是 GNU 专有
          echo "b64=$(base64 < /tmp/run-area.sh | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Run PPU basic correctness tests
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          nnodes: 0
          nproc_per_node: 2
          node_selector: ${{ env.PPU_NODE_SELECTOR }}
          host_volumes: ${{ env.PPU_HOST_VOLUMES }}
          image: ${{ env.PPU_BASE_IMAGE }}
          namespace: ${{ env.PPU_NAMESPACE }}
          timeout_minutes: 95
          # always：失败 Pod 若滞留会一直占着 2 张卡，挡住后续 run
          cleanup_policy: always
          # CI_WS 走 extra_env 而非插进 payload，投递目录变更不影响 payload 内容
          extra_env: "CI_WS=${{ needs.ppu-stage.outputs.ws }},HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_DEVICE_LABEL=OAM-810E,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }}"
          # 必须是单行且不含双引号，见上面 payload 步骤的注释
          command: echo ${{ steps.payload.outputs.b64 }} | base64 -d > /tmp/run-area.sh && bash /tmp/run-area.sh

  # ==================== 产物回收（零占卡）==================== #
  ppu-collect:
    needs: [ppu-stage, ppu-basic-correctness-test]
    # 测试失败也要取产物；stage 没成功则无处可取
    if: always() && needs.ppu-stage.result == 'success'
    runs-on: [self-hosted, ppu]
    timeout-minutes: 20
    env:
      WS: ${{ needs.ppu-stage.outputs.ws }}
    steps:
      # 本 job 不 checkout，工作区是 self-hosted runner 上的复用目录，
      # 里面可能残留上一个 run 的 test-results，先清掉
      - name: Collect test results from NAS
        shell: bash
        run: |
          rm -rf test-results
          if [ -d "${WS}/test-results" ]; then
            mkdir -p test-results
            cp -r "${WS}/test-results/." test-results/
            ls -l test-results
          else
            echo "::warning::no test-results under ${WS} — 容器内脚本在 EXIT trap" \
                 "触发前就退出了，或 Pod 根本没起来（看上一个 job 的日志）"
          fi

      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          f="test-results/summary.md"
          if [ -f "$f" ]; then
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Basic Correctness Test (PPU)"
              echo ""
              echo "summary.md not produced — the in-container script exited"
              echo "before its EXIT trap fired (see 'Run PPU basic correctness"
              echo "tests' log)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-basic-correctness-test-results
          path: |
            test-results/
          if-no-files-found: warn

      - name: Clean up NAS workspace
        if: always()
        shell: bash
        run: |
          rm -rf "${WS}" || echo "::warning::failed to remove ${WS} —" \
            "下一个 run 的 stale-dir sweep 会重试"

  # ==================== 聚合点 ==================== #
  ppu-test-finish:
    needs: [check-changes, ppu-stage, ppu-basic-correctness-test, ppu-collect]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 -c "
          import json, sys, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          failed = []
          for job, info in needs.items():
              result = info.get('result', 'unknown')
              print(f'{job}: {result}')
              if result not in ('success', 'skipped'):
                  failed.append(f'{job} ({result})')
          if failed:
              sep = ','
              print(f'Failed jobs: {sep.join(failed)}')
              sys.exit(1)
          print('All jobs completed successfully')
          "
