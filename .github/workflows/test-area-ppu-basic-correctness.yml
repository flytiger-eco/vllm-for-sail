# Basic Correctness (PPU) —— 最小可跑形态
#
# 一个 job，跑在 CPU runner group，用 flytiger-eco/ppu-distributed-action 在
# PPU 节点起 Pod 跑测试。nnodes=0 是单机模式，nproc_per_node=2 满足本 area
# multi 段内部 TP=2 的用卡需求。
#
# 代码投递：Pod 只有 image + host_volumes，拿不到 runner 工作区，而 Pod 内
# 访问不了 github（DNS 能解析但 TCP 超时，2026-08-31 实测）。所以只剩一条路
# —— job 容器 checkout 后把工作区拷到一块两边都看得见的 NAS，Pod 挂载同一
# 宿主机路径后 cd 进去执行。job 容器里到底有没有这样一块盘是本 workflow 的
# 成败前提，Stage 步骤会把它看到的现状打出来。
name: Basic Correctness Test (PPU)

on:
  push:
    branches: [feat/gha-ppu-test]
    paths:
      - ".github/workflows/test-area-ppu-basic-correctness.yml"
      - "scripts/ppu/ppu_install_dependency.sh"
      - "scripts/ppu/test-area-ppu-basic-correctness.sh"
      - "tests/basic_correctness/**"
  workflow_dispatch:

concurrency:
  group: test-area-ppu-basic-correctness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-vllm0.23.0-py312
  # 左侧宿主机路径、右侧容器内路径。wl_nas 在宿主机上叫 /wl_nas
  PPU_HOST_VOLUMES: /nas_aisw:/nas_aisw,/wl_nas:/mnt/wl_nas
  # /wl_nas 挂进 /mnt/wl_nas
  PPU_CI_STAGE_CANDIDATES: "/wl_nas/gha-ci=/mnt/wl_nas/gha-ci /mnt/wl_nas/gha-ci=/mnt/wl_nas/gha-ci /nas_aisw/gha-ci=/nas_aisw/gha-ci"
  PPU_CI_RUN_TAG: bc-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  test:
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    # 含 Pod 调度 + 镜像准备开销（实测约 210s）
    timeout-minutes: 110
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 不投递 .git（244 MB 小文件，NFS 上极慢）：容器内不构建 wheel、也不靠
      # setuptools-scm 推版本号（vllm/_version.py 由 ppu_install_dependency.sh
      # 从镜像 site-packages 拷入）
      - name: Stage workspace to NAS
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          echo "[probe] user=$(id -un) uid=$(id -u) gid=$(id -g)"
          df -hT 2>/dev/null | grep -Ei 'nfs|nas' || echo "[probe] 无 nfs/nas 挂载"
          ws=""
          for pair in ${PPU_CI_STAGE_CANDIDATES}; do
            here="${pair%%=*}"
            there="${pair#*=}"
            top="/$(printf '%s' "${here}" | cut -d/ -f2)"
            echo "[probe] ${top}: $(ls -ld "${top}" 2>&1 | head -1)"
            if mkdir -p "${here}/${PPU_CI_RUN_TAG}" 2>/dev/null \
               && [ -w "${here}/${PPU_CI_RUN_TAG}" ]; then
              ws="${here}/${PPU_CI_RUN_TAG}"
              echo "ws=${ws}" >> "$GITHUB_OUTPUT"
              echo "ws_pod=${there}/${PPU_CI_RUN_TAG}" >> "$GITHUB_OUTPUT"
              echo "[stage] usable: ${ws}（Pod 内是 ${there}/${PPU_CI_RUN_TAG}）"
              break
            fi
            echo "[stage] NOT usable: ${here}/${PPU_CI_RUN_TAG}"
          done
          if [ -z "${ws}" ]; then
            echo "::error::job 容器里没有可写的共享目录（试过 ${PPU_CI_STAGE_CANDIDATES}）。" \
                 "ARC 用的是 k8s-novolume hook，NAS 必须先挂进 job 容器才能投递代码；" \
                 "它实际看到什么见上面 [probe] 输出。"
            exit 1
          fi
          tar -cf - --exclude=./.git . | tar -xf - -C "${ws}"
          echo "[stage] ${ws} -> $(du -sh "${ws}" | cut -f1)"

      # action.yml 的「校验 inputs」步骤把 ${{ inputs.command }} 直接文本插值进
      # shell（if [ -z "<command>" ]），多行内容会撑坏引号奇偶并触发 syntax
      # error。base64 后是单行、只含 [A-Za-z0-9+/=]，被那对双引号整段吞掉。
      # 引号界定符的 heredoc 还保证 $(...) 留到 Pod 里才求值。
      - name: Build pod payload
        id: payload
        shell: bash
        run: |
          cat > /tmp/run.sh <<'RUN'
          #!/bin/bash
          cd "${CI_WS}" || exit 1
          echo "[pod] host=$(hostname) node=${NODE_NAME} nproc=${NPROC_PER_NODE}"
          # 原 docker --add-host 的替代：单机模式不建 Headless Service，Pod 自己的
          # hostname 在集群 DNS 里查不到，而 Ray/vLLM 要能把它解析成本机 IP
          echo "$(hostname -i | awk '{print $1}') $(hostname)" >> /etc/hosts || true
          rc=0
          bash scripts/ppu/ppu_install_dependency.sh || rc=$?
          if [ "${rc}" -eq 0 ]; then
            bash scripts/ppu/test-area-ppu-basic-correctness.sh || rc=$?
          fi
          echo "[pod] exit rc=${rc}"
          exit "${rc}"
          RUN
          bash -n /tmp/run.sh
          echo "b64=$(base64 < /tmp/run.sh | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Run PPU basic correctness tests
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          nnodes: 0
          nproc_per_node: 2
          node_selector: board-type=OAM-810E
          host_volumes: ${{ env.PPU_HOST_VOLUMES }}
          image: ${{ env.PPU_BASE_IMAGE }}
          namespace: ppu-sched
          timeout_minutes: 95
          # always：失败 Pod 若滞留会一直占着 2 张卡
          cleanup_policy: always
          extra_env: "CI_WS=${{ steps.stage.outputs.ws_pod }},HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_DEVICE_LABEL=OAM-810E,PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }}"
          # 必须单行且不含双引号，见上面 payload 步骤的注释
          command: echo ${{ steps.payload.outputs.b64 }} | base64 -d > /tmp/run.sh && bash /tmp/run.sh

      # 不留垃圾在 NAS 上；Pod 以 root 写下的文件 job 容器可能删不掉，失败只告警
      - name: Clean up NAS workspace
        if: always()
        shell: bash
        env:
          WS: ${{ steps.stage.outputs.ws }}
        run: |
          [ -n "${WS}" ] || exit 0
          rm -rf "${WS}" 2>/dev/null || echo "::warning::${WS} 未能删净（root 属主文件）"
