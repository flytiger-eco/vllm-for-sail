# Basic Correctness Test (PPU, K8s) —— test-area-ppu-basic-correctness 的 K8s 调度版
# ==============================================================================
# 重型 area 的 K8s 样例（对位轻量样例 test-area-ppu-attention-k8s.yml）。独立成
# 文件：不被 ci.yml 以 workflow_call 拉起，不进任何门禁；push 到本文件/被测脚本
# 即自跑一次，另留 workflow_dispatch 手动入口。
#
# 为什么选 basic-correctness 作重型样例：它比 attention 多了三类重型 area 特有
# 依赖，能一次验证整条链路的重载形态：
#   - 多卡：multi 段跑 -m distributed（TP=2），Pod 需申请 2 张 PPU
#   - 真模型：经 HF_HUB_CACHE + symlink 用 /nas_aisw 预置权重（opt-125m /
#     Llama-3.2-1B / tiny-random 系列）
#   - 特权容器：对位自托管版 docker --privileged --ipc=host --shm-size=8g，
#     经 container_options 映射（privileged / host_ipc / shm_size）
#
# 依赖/pytest 与用例选集完全复用 scripts/ppu/*.sh（零改动），TEST_MODE 语义与
# 自托管版一致：all(默认)=single+multi | single（限 1 卡）| multi（TP=2）。
name: Basic Correctness Test (PPU, K8s)

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "TEST_MODE：all(默认) | single | multi"
        type: string
        default: all
  # workflow_dispatch 按钮只对默认分支上已存在的 workflow 出现，特性分支上点不
  # 出来；故绑一个只盯自身路径的 push 触发：改完推上去即跑一次，不影响其他提交。
  push:
    paths:
      - ".github/workflows/test-area-ppu-basic-correctness-k8s.yml"
      - "scripts/ppu/ppu_install_dependency.sh"
      - "scripts/ppu/test-area-ppu-basic-correctness.sh"

concurrency:
  group: test-area-ppu-basic-correctness-k8s-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-vllm0.23.0-py312
  # push 触发时 inputs 为空，用 || 兜默认值
  TEST_MODE: ${{ inputs.test_mode || 'all' }}

jobs:
  ppu-basic-correctness-k8s:
    # CPU-only 编排 runner；container 提供 kubectl/工具链所在的 runner 镜像
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    # in-pod 95min + 调度/镜像准备开销（实测约 210s），对齐自托管版 100min 上限
    timeout-minutes: 110
    steps:
      # checkout 是触发 action 源码自动投递的前提：action 把 $GITHUB_WORKSPACE
      # 打包暂存 NAS，Pod 内解压到 source_dir（默认 /workspace/source）。
      # fetch-depth: 1 尽量缩小 .git，减少 NAS 打包体积与耗时。
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 为什么绕 base64：ppu-distributed-action 的 action.yml「校验 inputs」步骤
      # 把 ${{ inputs.command }} 直接文本插值进 `if [ -z "<command>" ]`，多行/含
      # 引号的 command 会引发 shell syntax error。base64 后是单行且只含
      # [A-Za-z0-9+/=]，被那对双引号整段吞掉，安全无副作用。
      - name: Build in-pod runner payload
        id: payload
        shell: bash
        run: |
          cat > /tmp/ppu-run.sh <<'RUNEOF'
          #!/bin/bash
          set -euo pipefail
          # action 把源码解压到 source_dir，默认 /workspace/source
          cd /workspace/source
          echo "[k8s-area] pwd=$(pwd) node=$NODE_NAME"
          echo "[k8s-area] TEST_MODE=${TEST_MODE:-all}"
          ls scripts/ppu/test-area-ppu-basic-correctness.sh
          bash scripts/ppu/ppu_install_dependency.sh
          bash scripts/ppu/test-area-ppu-basic-correctness.sh
          RUNEOF
          # 语法自检：runner 上早失败好过在 Pod 里烧一次调度
          bash -n /tmp/ppu-run.sh
          # tr 而非 base64 -w0：后者是 GNU 专有，前者到处都在
          echo "b64=$(base64 < /tmp/ppu-run.sh | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "payload $(wc -c < /tmp/ppu-run.sh) bytes"

      - name: Run PPU basic correctness tests (K8s)
        id: ppu
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          nnodes: 0            # 单机
          nproc_per_node: 2    # multi 段 distributed 用例 TP=2；single 段自限 1 卡
          node_selector: board-type=OAM-810E
          # /nas_aisw、/mnt/wl_nas 由 action 默认挂载，无需传 host_volumes
          image: ${{ env.PPU_BASE_IMAGE }}
          namespace: ppu-sched
          timeout_minutes: 95  # 对齐自托管版 in-pod 上限 90min 并留余量
          cleanup_policy: always
          # 对位自托管版 docker --privileged --ipc=host --shm-size=8g：
          # 多卡 distributed（NCCL 语义）需要特权与共享内存；
          # docker --ulimit memlock=-1 无 K8s 等价物，privileged 下进程可自行提升。
          container_options: |
            privileged: true
            host_ipc: true
            shm_size: "8Gi"
          # 注入 Pod 环境：HF 缓存、设备标签、被测脚本读的 TEST_MODE，以及
          # ppu_install_dependency.sh 从私有 PyPI 补装 pytest/ray 所需的凭证。
          # extra_env 以逗号分隔 KEY=VAL，值内勿含逗号。
          extra_env: >-
            HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_DEVICE_LABEL=OAM-810E,TEST_MODE=${{ env.TEST_MODE }},PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }}
          # 必须单行、不含双引号，见上面 payload 步骤注释
          command: echo ${{ steps.payload.outputs.b64 }} | base64 -d > /tmp/ppu-run.sh && bash /tmp/ppu-run.sh

      # action 的 outputs 契约，落到 run 的 Summary 页便于回看
      - name: Report action outputs
        if: always()
        env:
          OUT_JOB_NAME: ${{ steps.ppu.outputs.job_name }}
          OUT_JOB_STATUS: ${{ steps.ppu.outputs.job_status }}
          OUT_DURATION: ${{ steps.ppu.outputs.duration_seconds }}
          OUT_TASK_PODS: ${{ steps.ppu.outputs.task_pods }}
        run: |
          {
            echo "### Basic Correctness Test (PPU, K8s)"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| test_mode | ${TEST_MODE:-all} |"
            echo "| image | \`${PPU_BASE_IMAGE}\` |"
            echo "| job_name | ${OUT_JOB_NAME:-<empty>} |"
            echo "| job_status | ${OUT_JOB_STATUS:-<empty>} |"
            echo "| duration_seconds | ${OUT_DURATION:-<empty>} |"
            echo "| task_pods | ${OUT_TASK_PODS:-<empty>} |"
          } >> "$GITHUB_STEP_SUMMARY"
