# PPU samplers tests, called by ci.yml (port of
# `.legacyci/test-area-ppu-samplers.yaml`). Tests run in a K8s worker Pod;
# the selection lives in scripts/ppu/test-area-ppu-samplers.sh.
name: Samplers Test (PPU)

on:
  workflow_call:
    inputs:
      test_mode:
        description: "TEST_MODE: all (default) | single | multi"
        type: string
        default: all
      pytest_args:
        description: 'Extra pytest arguments, e.g. "-k test_foo -x" (passed through as PYTEST_EXTRA_ARGS)'
        type: string
        default: ""
      wheel_artifact:
        description: "Name of the CI-built wheel artifact (passed by ci.yml); empty uses the vllm preinstalled in the image"
        type: string
        default: ""

concurrency:
  group: test-area-ppu-samplers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:sdk2.2.0-pytorch2.13.0-ubuntu24.04-cuda13.0-vllm0.27.0-py312-20261001

jobs:
  ppu-samplers-test:
    # Fork PR code must not reach the PPU Pod (devices, NAS, credentials).
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 60
    steps:
      # The action ships $GITHUB_WORKSPACE to the Pod.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch CI-built wheel
        id: fetch-wheel
        continue-on-error: true
        if: inputs.wheel_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.wheel_artifact }}
          path: ci-wheel

      - name: Wait before wheel fetch retry
        if: steps.fetch-wheel.outcome == 'failure'
        run: |
          rm -rf ci-wheel
          sleep 60

      - name: Fetch CI-built wheel (retry)
        if: steps.fetch-wheel.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.wheel_artifact }}
          path: ci-wheel

      - name: Build in-pod runner payload
        id: payload
        shell: bash
        env:
          TEST_MODE: ${{ inputs.test_mode }}
          PYTEST_EXTRA_ARGS: ${{ inputs.pytest_args }}
          WHEEL_ARTIFACT: ${{ inputs.wheel_artifact }}
        run: |
          # ci-wheel/ ships with the source; use its in-Pod path.
          if [ -n "${WHEEL_ARTIFACT:-}" ]; then
            shopt -s nullglob
            wheels=(ci-wheel/*.whl)
            if [ "${#wheels[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one CI-built wheel"
              exit 1
            fi
            PPU_WHEEL_PATH="/workspace/source/${wheels[0]}"
          fi
          # The action pastes command into `if [ -z "..." ]`; base64 keeps it
          # a single line without quotes.
          cat > /tmp/ppu-run.sh <<'RUNEOF'
          #!/bin/bash
          set -euo pipefail
          cd /workspace/source
          echo "[k8s-area] node=${NODE_NAME:-unknown} TEST_MODE=${TEST_MODE:-all}"
          bash scripts/ppu/ppu_install_dependency.sh
          bash scripts/ppu/test-area-ppu-samplers.sh
          RUNEOF
          bash -n /tmp/ppu-run.sh
          # Portable form of base64 -w0.
          echo "b64=$(base64 < /tmp/ppu-run.sh | tr -d '\n')" >> "$GITHUB_OUTPUT"
          # Comma-separated KEY=VAL: no commas in values, no empty values.
          envs="HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_DEVICE_LABEL=OAM-810E"
          envs="${envs},TEST_MODE=${TEST_MODE:-all}"
          if [ -n "${PYTEST_EXTRA_ARGS:-}" ]; then
            envs="${envs},PYTEST_EXTRA_ARGS=${PYTEST_EXTRA_ARGS}"
          fi
          if [ -n "${PPU_WHEEL_PATH:-}" ]; then
            envs="${envs},PPU_WHEEL_PATH=${PPU_WHEEL_PATH}"
          fi
          # Read back by Publish test summary.
          envs="${envs},PPU_SUMMARY_NAS_DIR=/mnt/wl_nas/devops/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${GITHUB_JOB}"
          echo "extra_env=${envs}" >> "$GITHUB_OUTPUT"

      - name: Run PPU samplers tests
        id: ppu
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          # Single node, one card.
          nnodes: 0
          nproc_per_node: 1
          node_selector: board-type=OAM-810E
          # /nas_aisw and /mnt/wl_nas are mounted by default.
          image: ${{ env.PPU_BASE_IMAGE }}
          namespace: ppu-sched
          timeout_minutes: 40
          cleanup_policy: always
          # Keep privileged unset: the device plugin then exposes only the
          # allocated card, so areas can run in parallel.
          container_options: |
            host_ipc: true
            shm_size: "8Gi"
          extra_env: ${{ steps.payload.outputs.extra_env }},PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }}
          # Must stay a single line (see the payload step).
          command: echo ${{ steps.payload.outputs.b64 }} | base64 -d > /tmp/ppu-run.sh && bash /tmp/ppu-run.sh

      # Prefer the summary returned via NAS; fall back to job metadata.
      - name: Publish test summary
        if: always()
        env:
          OUT_JOB_NAME: ${{ steps.ppu.outputs.job_name }}
          OUT_JOB_STATUS: ${{ steps.ppu.outputs.job_status }}
          OUT_DURATION: ${{ steps.ppu.outputs.duration_seconds }}
          OUT_TASK_PODS: ${{ steps.ppu.outputs.task_pods }}
          OUT_LOG_ARTIFACT: ${{ steps.ppu.outputs.log_artifact_name }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: |
          NAS_SUM="/wl_nas/devops/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${GITHUB_JOB}/summary.md"
          {
            if [ -f "${NAS_SUM}" ]; then
              cat "${NAS_SUM}"
              echo ""
              echo "<sub>mode: ${TEST_MODE:-all} · K8s job \`${OUT_JOB_NAME:-<empty>}\` · ${OUT_JOB_STATUS:-<empty>} · ${OUT_DURATION:-<empty>}s · pods: \`${OUT_TASK_PODS:-<empty>}\` · log: \`${OUT_LOG_ARTIFACT:-<empty>}\`</sub>"
            else
              echo "### Samplers Test (PPU, K8s)"
              echo ""
              echo "> summary.md was not returned (the in-Pod script exited before its EXIT trap, or NAS was not writable). Showing job metadata only; see the job log above for test details."
              echo ""
              echo "| item | value |"
              echo "|---|---|"
              echo "| test_mode | ${TEST_MODE:-all} |"
              echo "| image | \`${PPU_BASE_IMAGE}\` |"
              echo "| job_name | ${OUT_JOB_NAME:-<empty>} |"
              echo "| job_status | ${OUT_JOB_STATUS:-<empty>} |"
              echo "| duration_seconds | ${OUT_DURATION:-<empty>} |"
              echo "| task_pods | ${OUT_TASK_PODS:-<empty>} |"
              echo "| log_artifact | ${OUT_LOG_ARTIFACT:-<empty>} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Single status check for branch protection.
  ppu-samplers-finish:
    needs: [ppu-samplers-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 -c "
          import json, sys, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          failed = []
          for job, info in needs.items():
              result = info.get('result', 'unknown')
              print(f'{job}: {result}')
              if result not in ('success', 'skipped'):
                  failed.append(f'{job} ({result})')
          if failed:
              sep = ','
              print(f'Failed jobs: {sep.join(failed)}')
              sys.exit(1)
          print('All jobs completed successfully')
          "
