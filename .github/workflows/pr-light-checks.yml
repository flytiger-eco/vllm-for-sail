name: PR lightweight checks

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-light-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-check:
    name: Validate PR source
    if: >-
      contains(fromJSON('["v0.26.0", "v0.27.0", "v0.28.0"]'),
      github.event.pull_request.base.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.source.outputs.repository }}
    steps:
      - name: Require an accessible source repository
        id: source
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ -z "$HEAD_REPOSITORY" ]; then
            echo "::error::The pull request source repository is unavailable."
            exit 1
          fi
          echo "repository=$HEAD_REPOSITORY" >> "$GITHUB_OUTPUT"

  secret-scan:
    name: Pre-check / Secret Scan (TruffleHog)
    needs: source-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ needs.source-check.outputs.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog OSS secret scan
        uses: trufflesecurity/trufflehog@e7a8d17d2f726cf414310a625b55cca7dc9c898e
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown,unverified

  smoke-test:
    name: Smoke Test
    needs: [source-check, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ needs.source-check.outputs.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Static smoke checks
        run: |
          for file in scripts/ppu/*.sh; do bash -n "$file"; done
          python3 -m py_compile scripts/ppu/check-exclusions.py
          python3 scripts/ppu/check-exclusions.py
