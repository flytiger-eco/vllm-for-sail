name: PR lightweight checks

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: >-
    pr-light-${{ github.event.pull_request.number }}-${{
    github.event_name == 'pull_request_review' && 'review' || 'head' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  secret-scan:
    name: Pre-check / Secret Scan (TruffleHog)
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["v0.26.0", "v0.27.0", "v0.28.0"]'),
      github.event.pull_request.base.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog OSS secret scan
        uses: trufflesecurity/trufflehog@e7a8d17d2f726cf414310a625b55cca7dc9c898e
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown,unverified

  smoke-test:
    name: Smoke Test
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Static smoke checks
        run: |
          for file in scripts/ppu/*.sh; do bash -n "$file"; done
          python3 -m py_compile scripts/ppu/check-exclusions.py
          python3 scripts/ppu/check-exclusions.py

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    if: >-
      contains(fromJSON('["v0.26.0", "v0.27.0", "v0.28.0"]'),
      github.event.pull_request.base.ref) &&
      (github.event_name == 'pull_request_target' ||
      github.event.review.user.type == 'Bot')
    permissions:
      contents: read
      pull-requests: read
    uses: flytiger-eco/.github/.github/workflows/ai-code-review.yml@c03108c83177ebf0038bb5f49b0e15db9b2f78de
