# ==============================================================================
# test-area-ppu-engine-test.yml — engine 卡住根因的三步验证（临时，勿合主线）
# ------------------------------------------------------------------------------
# 背景（2026-09-10 run 34440797915）：engine + quantization/misc/
# e2e-integration/expert-parallelism 共 5 个 Pod 被调度到
# na131t-ppu810e-test002 后 running=0 直至 action 超时（同批 test001 上的
# 5 个 Pod 全部正常拉起）。
#
# 根因已实锤（本 workflow 首轮 run 34466091018 诊断）：test002 kubelet 拉取
# llm:v2.1.1 镜像 403 Forbidden → ImagePullBackOff（3h15m 重试 842 次），
# test001 可正常拉取——test002 对私有 registry 的认证失效，需 owner 修。
#
# 三步验证（对应排查结论的处置建议）：
#   ① 诊断留证：describe 卡住的 engine Pod + 节点状态（runner SA 无 cluster
#     权限，nodes 查询会 403，全部容错不中断）；
#   ② cordon test002：同上权限受限，降级为 best-effort + 提示 owner 手动执行；
#   ③ 重跑 engine（TEST_MODE=single，分钟级）：node_selector 钉健康节点
#     test001，验证 Pod 拉起与测试执行恢复正常。
#
# 触发：push 到 feat/gha-ppu-test / 手动 dispatch。
# ==============================================================================
name: PPU Engine Node Diagnose & Rerun (test)

on:
  push:
    branches: [feat/gha-ppu-test]
  workflow_dispatch: {}

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-vllm0.23.0-py312
  BAD_NODE: na131t-ppu810e-test002.eng.t-head.cn
  NS: ppu-sched
  # run 34440797915 中卡住的 engine Pod；若已被超时清理则诊断步骤降级为仅查节点
  STUCK_POD: ppu-flytiger-eco-34440797915-1-ppu-engine-test-worker-0

jobs:
  # ---- 步骤①②：诊断留证 + cordon 坏节点 ----
  diagnose-cordon:
    runs-on: k8s-runner-group-cpu-flytiger
    container: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 20
    steps:
      # runner 镜像不带 kubectl（ppu-distributed-action 也是临时下载）；
      # 集群访问走 runner Pod 的 in-cluster SA（action 侧 submit.sh 同机制）
      - name: Install kubectl
        run: |
          ver="$(curl -sfL --retry 3 https://dl.k8s.io/release/stable.txt)"
          curl -sfL --retry 3 "https://dl.k8s.io/release/${ver}/bin/linux/amd64/kubectl" -o /tmp/kubectl
          chmod +x /tmp/kubectl
          echo "/tmp" >> "$GITHUB_PATH"
          kubectl version --client=true

      - name: Step1 diagnose stuck pod & node
        run: |
          # 留证优先，任何单项失败不中断（Pod 可能已被超时清理）
          echo "===== ① 卡住 Pod 状态与 waiting reason ====="
          kubectl -n "${NS}" get pod "${STUCK_POD}" -o wide || \
            echo "(Pod 已不存在——action 超时后 cleanup_policy=always 已清理)"
          kubectl -n "${NS}" get pod "${STUCK_POD}" \
            -o jsonpath='phase={.status.phase} waiting={.status.containerStatuses[*].state.waiting.reason}' 2>/dev/null || true
          echo; echo "===== ② Pod Events（卡在 Pulling/设备分配/挂载哪一步） ====="
          kubectl -n "${NS}" describe pod "${STUCK_POD}" 2>/dev/null | tail -40 || true
          echo "===== ③ test002 节点状态与 PPU 资源分配 ====="
          # runner SA（arc-runners:arc-runner-cpu）无 cluster 级权限，nodes
          # 查询会 403——容错跳过，不因权限问题中断留证
          kubectl get node "${BAD_NODE}" -o wide 2>&1 || true
          kubectl describe node "${BAD_NODE}" 2>&1 | \
            sed -n '/Allocated resources/,/Events/p' || true
          echo "===== ④ test002 上当前滞留的 Pod ====="
          kubectl -n "${NS}" get pods -o wide \
            --field-selector "spec.nodeName=${BAD_NODE}" || true

      - name: Step2 cordon test002
        run: |
          # runner SA 无 cluster 级权限，cordon 会 403——降级为提示 owner
          # 手动执行，不阻塞步骤③（rerun 已用 node_selector 钉 test001，
          # 不依赖 cordon 生效）
          kubectl cordon "${BAD_NODE}" 2>&1 || \
            echo "::warning::cordon 需 owner 手动执行: kubectl cordon ${BAD_NODE}"

  # ---- 步骤③：重跑 engine（single）验证调度恢复健康 ----
  rerun-engine:
    needs: diagnose-cordon
    runs-on: k8s-runner-group-cpu-flytiger
    container: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 不传 wheel_artifact：沿用镜像预装 vllm（本验证只关心调度与拉起）
      - name: Build in-pod runner payload
        id: payload
        env:
          TEST_MODE: single
        run: |
          cat > /tmp/ppu-run.sh <<'RUNEOF'
          #!/bin/bash
          set -euo pipefail
          cd /workspace/source
          bash scripts/ppu/ppu_install_dependency.sh
          bash scripts/ppu/test-area-ppu-engine.sh
          RUNEOF
          bash -n /tmp/ppu-run.sh
          echo "b64=$(base64 < /tmp/ppu-run.sh | tr -d '\n')" >> "$GITHUB_OUTPUT"
          envs="HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_DEVICE_LABEL=OAM-810E"
          envs="${envs},TEST_MODE=${TEST_MODE:-single}"
          envs="${envs},PPU_SUMMARY_NAS_DIR=/mnt/wl_nas/devops/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${GITHUB_JOB}"
          echo "extra_env=${envs}" >> "$GITHUB_OUTPUT"

      # 验证点：[worker-0] 输出应进入 deps/pytest 阶段（而非 running=0
      # 直至超时）
      - name: Run PPU engine tests (single)
        id: ppu
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          nnodes: 0
          nproc_per_node: 1
          # 钉健康节点 test001（test002 镜像 403 修复前绕开；修复后改回
          # board-type=OAM-810E）
          node_selector: kubernetes.io/hostname=na131t-ppu810e-test001.eng.t-head.cn
          image: ${{ env.PPU_BASE_IMAGE }}
          namespace: ppu-sched
          timeout_minutes: 45
          cleanup_policy: always
          container_options: |
            host_ipc: true
            shm_size: "8Gi"
          extra_env: ${{ steps.payload.outputs.extra_env }},PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }}
          command: echo ${{ steps.payload.outputs.b64 }} | base64 -d > /tmp/ppu-run.sh && bash /tmp/ppu-run.sh

      - name: Publish test summary
        if: always()
        env:
          OUT_JOB_NAME: ${{ steps.ppu.outputs.job_name }}
          OUT_JOB_STATUS: ${{ steps.ppu.outputs.job_status }}
          OUT_DURATION: ${{ steps.ppu.outputs.duration_seconds }}
          OUT_TASK_PODS: ${{ steps.ppu.outputs.task_pods }}
        run: |
          {
            echo "### Engine Rerun (single, after cordon test002)"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| bad_node | ${BAD_NODE} (cordoned) |"
            echo "| job_name | ${OUT_JOB_NAME:-<empty>} |"
            echo "| job_status | ${OUT_JOB_STATUS:-<empty>} |"
            echo "| duration_seconds | ${OUT_DURATION:-<empty>} |"
            echo "| task_pods | ${OUT_TASK_PODS:-<empty>} |"
          } >> "$GITHUB_STEP_SUMMARY"
