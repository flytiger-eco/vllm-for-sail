# Aone CI `.aoneci/test-area-ppu-entrypoints-llm.yaml` 的 GitHub Actions 移植版
# 结构：
#   check-changes — 路径变更门禁（对位 Aone diff-guard）
#   ppu-entrypoints-llm-test — PPU runner 上 docker 内装依赖 + 跑 pytest
#   ppu-entrypoints-llm-finish — 分支保护聚合点
#
# 测试选集见 scripts/ppu/test-area-ppu-entrypoints-llm.sh。
name: Entrypoints LLM Test (PPU)

on:
  # 重量级 area（PPU 整机仅一个 runner，job 串行；本档最长实测 2h14min）：
  # PR 上由 ppu-full 标签显式拉起，夜间/周末由 nightly-ppu.yml 兜底。
  # 依赖路径清单保留在下方 check-changes 的 dorny 过滤器中。
  pull_request:
    # feat/gha-ppu-test：开发期验证用，合入 v0.23.0 后移除
    branches: [v0.23.0, feat/gha-ppu-test]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      test_mode:
        description: "TEST_MODE：all(默认) | single | multi"
        type: string
        default: all
      pytest_args:
        description: '追加的 pytest 参数，如 "-k test_foo -x"（透传 PYTEST_EXTRA_ARGS）'
        type: string
        default: ""

concurrency:
  group: test-area-ppu-entrypoints-llm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-vllm0.23.0-py312

jobs:
  # ==================== 变更检查 ==================== #
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      changes_exist: ${{ steps.decide.outputs.changes_exist }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 仅 PR 用 dorny/paths-filter
      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        with:
          filters: |
            ppu_code:
              - ".github/workflows/test-area-ppu-entrypoints-llm.yml"
              - "scripts/ppu/ppu_install_dependency.sh"
              - "scripts/ppu/test-area-ppu-entrypoints-llm.sh"
              - "tests/entrypoints/llm/**"
              - "vllm/*"

      - name: Decide whether to run tests
        id: decide
        env:
          FILTER_HIT: ${{ steps.filter.outputs.ppu_code }}
          HAS_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ppu-full') }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # 重量级 area 在 PR 上默认不跑，需显式打 ppu-full 标签；
            # 路径命中结果仅记录，作为后续提升为自动触发档的观测数据。
            echo "[gate] paths_hit=${FILTER_HIT:-false} ppu_full_label=${HAS_FULL_LABEL}"
            echo "changes_exist=${HAS_FULL_LABEL}" >> "$GITHUB_OUTPUT"
          else
            # 手动触发（workflow_dispatch）：必跑
            echo "changes_exist=true" >> "$GITHUB_OUTPUT"
          fi

  # ==================== PPU Entrypoints LLM ==================== #
  ppu-entrypoints-llm-test:
    needs: [check-changes]
    # fork PR 不进特权 self-hosted runner（--privileged + 设备直通 +
    # NAS 挂载 + artifactory 凭证，不能被外部 PR 的代码驱动）
    if: >-
      needs.check-changes.outputs.changes_exist == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, ppu]
    timeout-minutes: 60
    steps:
      - name: Clean workspace
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            ${{ env.PPU_BASE_IMAGE }} \
            bash -c "rm -rf /workspace/.??* /workspace/* 2>/dev/null; true"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run PPU entrypoints-llm tests
        timeout-minutes: 50
        env:
          PPU_ARTIFACTORY_USER: ${{ secrets.PPU_ARTIFACTORY_USER }}
          PPU_ARTIFACTORY_PASSWORD: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}
          TEST_MODE: ${{ inputs.test_mode || 'all' }}
          PYTEST_EXTRA_ARGS: ${{ inputs.pytest_args || '' }}
        run: |
          docker run --rm \
            --privileged \
            --network host \
            --add-host="$(hostname):$(hostname -I | awk '{print $1}')" \
            --device=/dev/alixpu_ctl \
            --device=/dev/alixpu \
            --ipc=host \
            --init \
            --shm-size=8g \
            --ulimit memlock=-1 \
            --ulimit stack=67108864 \
            -v ${{ github.workspace }}:/workspace \
            -v /nas_aisw:/nas_aisw \
            -e HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub \
            -e PPU_ARTIFACTORY_USER \
            -e PPU_ARTIFACTORY_PASSWORD \
            -e TEST_MODE \
            -e PYTEST_EXTRA_ARGS \
            -e PPU_DEVICE_LABEL=OAM-810E \
            ${{ env.PPU_BASE_IMAGE }} \
            bash -c "
              cd /workspace && \
              bash scripts/ppu/ppu_install_dependency.sh && \
              bash scripts/ppu/test-area-ppu-entrypoints-llm.sh
            "

      - name: Publish test summary
        if: always()
        run: |
          f="test-results/summary.md"
          if [ -f "$f" ]; then
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Entrypoints LLM Test (PPU)"
              echo ""
              echo "summary.md not produced — the in-container script exited"
              echo "before its EXIT trap fired (see 'Run PPU entrypoints-llm"
              echo "tests' log)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-entrypoints-llm-test-results
          path: |
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Annotate failed tests
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: test-results/test.xml
          check_name: PPU Entrypoints LLM Test Report
          annotate_only: true
          detailed_summary: true
          fail_on_failure: false
          require_tests: false

  # ==================== 聚合点 ==================== #
  ppu-entrypoints-llm-finish:
    needs: [check-changes, ppu-entrypoints-llm-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 -c "
          import json, sys, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          failed = []
          for job, info in needs.items():
              result = info.get('result', 'unknown')
              print(f'{job}: {result}')
              if result not in ('success', 'skipped'):
                  failed.append(f'{job} ({result})')
          if failed:
              sep = ','
              print(f'Failed jobs: {sep.join(failed)}')
              sys.exit(1)
          print('All jobs completed successfully')
          "
