    needs: [human-review, human-review-waived, build-wheel, ppu-benchmarks,
            ppu-cuda, ppu-entrypoints-llm, ppu-lm-eval, ppu-lora, ppu-misc,
            ppu-quantization]
    if: >-
      always() &&
      needs.build-wheel.result == 'success' &&
      (needs.human-review.result == 'success' ||
       needs.human-review-waived.result == 'success')
    uses: ./.github/workflows/test-area-ppu-model-runner-v2.yml
    with:
      wheel_artifact: ${{ needs.build-wheel.outputs.artifact_name }}
    secrets: inherit

  ppu-pytorch:
    needs: [human-review, human-review-waived, build-wheel]
    if: >-
      always() &&
      needs.build-wheel.result == 'success' &&
      (needs.human-review.result == 'success' ||
       needs.human-review-waived.result == 'success')
    uses: ./.github/workflows/test-area-ppu-pytorch.yml
    with:
      wheel_artifact: ${{ needs.build-wheel.outputs.artifact_name }}
    secrets: inherit

  ppu-quantization:
    # batch2：并发节流，等 batch1 释放（见 Stage 4 头注释）
    needs: [human-review, human-review-waived, build-wheel, ppu-attention,
            ppu-distributed, ppu-entrypoints, ppu-expert-parallelism,
            ppu-model-executor, ppu-pytorch, ppu-samplers, ppu-weight-loading]
    if: >-
      always() &&
      needs.build-wheel.result == 'success' &&
      (needs.human-review.result == 'success' ||
       needs.human-review-waived.result == 'success')
    uses: ./.github/workflows/test-area-ppu-quantization.yml
    with:
      wheel_artifact: ${{ needs.build-wheel.outputs.artifact_name }}
    secrets: inherit

  ppu-weight-loading:
    needs: [human-review, human-review-waived, build-wheel]
    if: >-
      always() &&
      needs.build-wheel.result == 'success' &&
      (needs.human-review.result == 'success' ||
       needs.human-review-waived.result == 'success')
    uses: ./.github/workflows/test-area-ppu-weight-loading.yml
    with:
      wheel_artifact: ${{ needs.build-wheel.outputs.artifact_name }}
    secrets: inherit

  # ---- Stage 5: 聚合点（skipped 视为通过；供分支保护配单条 required check）----
  ci:
    name: Full CI
    needs:
      - precheck
      - smoke-test
      - ai-code-review
      - build-wheel
      - human-review
      - human-review-waived
      - ppu-attention
      - ppu-model-executor
      - ppu-entrypoints
      - ppu-samplers
      - ppu-basic-correctness
      - ppu-entrypoints-llm
      - ppu-lora
      - ppu-models-basic
      - ppu-engine
      - ppu-kernels
      - ppu-benchmarks
      - ppu-compile
      - ppu-cuda
      - ppu-distributed
      - ppu-e2e-integration
      - ppu-expert-parallelism
      - ppu-lm-eval
      - ppu-misc
      - ppu-model-runner-v2
      - ppu-pytorch
      - ppu-quantization
      - ppu-weight-loading
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 -c "
          import json, sys, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          failed = []
          for job, info in needs.items():
              result = info.get('result', 'unknown')
              print(f'{job}: {result}')
              if result not in ('success', 'skipped'):
                  failed.append(f'{job} ({result})')
          if failed:
              print('Failed jobs: ' + ','.join(failed))
              sys.exit(1)
          print('All jobs completed successfully')
          "
