# flytiger-eco 组织统一 PR 门禁 + PPU per-PR CI 的统一编排入口。
# 开发者使用说明见 scripts/ppu/docs/ppu-per-pr-ci-guide.md。
#
# 链（对齐组织门禁流水线）：
#   pr（无需打标签）→ precheck → (smoke-test ∥ ai-code-review ∥ build-wheel)
#                                   └→ human-review → PPU area ×22
#                                      （每个 area 依路径变更决定是否真正跑）
#
# - 普通 PR 无需任何标签即可进入完整门禁链；每个 area 在自己的 check-changes 里
#   按路径 diff 决定是否上 PPU 卡（路径未命中则该 area skip，不占卡）。
# - 三条组织门禁（precheck / ai-code-review / human-review）是
#   flytiger-eco/.github 的 reusable workflow，逻辑集中维护、自带 permissions，
#   本文件只做 uses + needs 编排。human-review 另有一条本地豁免通道，见 Stage 3b。
# - PPU area 测试经 workflow_call 调用本仓库 test-area-ppu-*.yml（这些文件已
#   不接受 pull_request 直接触发）；路径过滤仍在各自的 check-changes 里，
#   被调时继承本文件的 PR 事件上下文，过滤逻辑不受影响。
# - 两个可选标签：
#     skip-human-review —— 跳过 human-review 真人审批（改走本地豁免通道）。
#     run-all           —— 无条件执行全部 22 个 area（不跳过 precheck/review 等
#                          前置门禁）；各 area 的 check-changes 见此标签即强制跑。
# - concurrency 单组互斥：同一 PR 任何时刻只有一个 CI run 在跑，且存活的 run
#   必然覆盖全部 22 个 area（推导见下方 concurrency 注释）。

name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  actions: read # 透传 area：callee 权限只降不升
  pull-requests: read

concurrency:
  # 单组互斥，保证只有一个 run 覆盖全部 22 个 area。labeled 事件只有 skip-human-review /
  # run-all 两个「会改变编排」的标签归 main 组，其余标签归 noop 组，避免无关标签重开门禁链。
  group: ci-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && !contains(fromJSON('["skip-human-review", "run-all"]'), github.event.label.name) && 'noop' || 'main' }}
  cancel-in-progress: true

jobs:
  # Stage 1: 密钥扫描预检（组织级 reusable workflow）
  precheck:
    name: Pre-check
    uses: flytiger-eco/.github/.github/workflows/user-precheck.yml@main

  # Stage 2: 冒烟测试 与 AI 评审 并行
  smoke-test:
    name: Smoke Test
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # PPU CI 静态冒烟：shell/python 语法 + 排除项有效性。
      # 不与现有 workflow 重复：pre-commit 全套检查由 pre-commit.yml 负责；
      # check-exclusions 在 selfcheck 里有 paths 过滤，这里每个 PR 都跑。
      - name: Static smoke checks
        run: |
          for f in scripts/ppu/*.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/ppu/check-exclusions.py
          python3 scripts/ppu/check-exclusions.py

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    uses: flytiger-eco/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  # ---- Stage 2b: PPU wheel 构建 ----
  # [ci-smoke] 本验证分支临时改为「转存现成 wheel」：复用 build-ppu-wheel-test
  # run 34571583490 的产物（构建于 feat/gha-ppu-test HEAD，vllm 源码与本分支
  # 零 diff），跨 run 下载后以生产 artifact 名重新上传，下游 area 无感知。
  # 省约 90min 生产构建；正式链路仍是 uses: ./.github/workflows/build-ppu-wheel.yml。
  build-wheel:
    name: Build PPU Wheel
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # 跨 run 下载 artifact
    outputs:
      artifact_name: wheel-py3.12-cu13.0-x86_64-v0_23_0
    steps:
      - name: Fetch prebuilt wheel from build-ppu-wheel-test run
        uses: actions/download-artifact@v4
        with:
          name: wheel-test-py3.12-cu13.0-x86_64-v0_23_0
          repository: flytiger-eco/vllm-for-sail
          run-id: 34571583490
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ci-wheel
      - name: Re-upload as CI wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-py3.12-cu13.0-x86_64-v0_23_0
          path: ci-wheel/*.whl
          retention-days: 1
          if-no-files-found: error

  # ---- Stage 3: 人工审批门禁 ----
  # 普通 PR 默认走组织 reusable 门禁轮询真人 APPROVED；PR 带 skip-human-review
  # 标签时改走下方的本地豁免 job。两条通道互斥，下游 area 以「任一 success」放行。
  human-review:
    name: Human Review Gate
    needs: [smoke-test, ai-code-review]
    # labeled 事件只认 skip-human-review / run-all 两个会改变编排的标签，打无关
    # 标签不重开门禁链；synchronize/open 等行为不变。带 skip-human-review 时本
    # job 让位给下方豁免通道。
    if: >-
      (github.event.action != 'labeled' ||
       contains(fromJSON('["skip-human-review", "run-all"]'), github.event.label.name)) &&
      !contains(github.event.pull_request.labels.*.name, 'skip-human-review') &&
      contains(fromJSON('["v0.23.0", "feat/gha-ppu-test"]'), github.base_ref)
    uses: flytiger-eco/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  # 豁免通道：GitHub 平台禁止 PR 作者 approve 自己的 PR（UI / REST / GraphQL
  # 一律返回 "Can not approve your own pull request"），而本仓库日常只有作者
  # 一人提交，上面的轮询门禁于是成为结构性死锁：空等 6h 后 failure，22 个
  # area 永不派发。带 skip-human-review 标签时由本 job 直接放行：打标签本身即
  # 人工动作、需 triage 权限、在 PR 时间线留痕可审计，授权强度不弱于一次
  # approve。job 名与 human-review 区分，避免 UI 上两个同名 job 混淆；下游 area
  # 以「两条通道任一 success」为放行条件，分支保护仍只需配 Full CI。
  human-review-waived:
    name: Human Review Gate (Waived)
    needs: [smoke-test, ai-code-review]
    if: >-
      (github.event.action != 'labeled' ||
       contains(fromJSON('["skip-human-review", "run-all"]'), github.event.label.name)) &&
      contains(github.event.pull_request.labels.*.name, 'skip-human-review') &&
      contains(fromJSON('["v0.23.0", "feat/gha-ppu-test"]'), github.base_ref)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record waiver
        run: |
          echo "✅ human-review 已由 skip-human-review 标签豁免放行。"
          echo "PR   : ${{ github.event.pull_request.html_url }}"
          echo "base : ${{ github.base_ref }}   head: ${{ github.head_ref }}"
          echo "依据：标签由具 triage 权限者添加，PR 时间线留痕可审计。"

  # ---- Stage 4: PPU area（22 个）----
  # 放行条件 = build-wheel 成功 且 门禁两条通道任一 success。always() 是必需的：
  # 未走的那条通道必然 skipped，而 needs 里有 skipped 时默认会级联跳过本 job。
  # 显式判定 build-wheel 以保持「wheel 没出来就不跑 area」的原语义；两条通道都
  # 被跳过（base 不在白名单）或门禁 failure/超时/cancelled 时，本档同样跳过。
  # 每个 area 内部的 check-changes 再按路径 diff 决定是否真正上卡；PR 带 run-all
  # 标签时 check-changes 无条件放行（该判定在各 area 文件内，见其 decide 步骤）。
  # 注意：models-distributed / models-multimodal 仅挂 nightly-ppu.yml（重量级
  # 回归兜底，不进 PR 门禁）；spec-decode 仅 workflow_dispatch 手动入口（依赖
  # 模型未入库，详见该文件头注释），三者均不在本文件编排。
  #
  # 并发节流（run 34602096292 起）：集群仅 2 台 OAM-810E 节点，且仅 na131t
  # 预置了 CI 镜像；area 同时扇出超单节点容量时排队，排队中的 pod 会被调
  # 度到无镜像节点 → 容器拉镜像 20~45 分钟超时 failed、全程零输出
  # （mr-v2 三轮、compile 一轮均此模式）。故 22 个 area 分三批串行，
  # 单批卡数上限 13（= 已实测安全的并发水位）。
  #
  # 划分依据从「卡数档」改为「实测时长」（run 34801163467 等 2~3 轮统计）：
  # 原按 nproc_per_node 切档时，两个最长的 area 恰好都是 1 卡
  # （kernels 2h06m、engine 1h28m），全压在 batch1，导致后两批干等 2 小时、
  # 首个信号也要 2h06m 才出来。改为长极后置后总关键路径 3h39m → 约 2h58m，
  # 首批出结果 2h06m → 约 13m。三批串行的总时长是 Σmax(每批)，故仅调换
  # 批次顺序无效，必须重新划分成员。
  #   batch1 8 个 / 11 卡 / 长极 12m49s（原位 needs，不挂前置批次）：
  #     attention/distributed/entrypoints/expert-parallelism/
  #     model-executor/pytorch/samplers/weight-loading
  #   batch2 7 个 / 13 卡 / 长极 ~40m（needs += batch1 全部）：
  #     benchmarks/cuda/entrypoints-llm/lm-eval/lora/misc/quantization
  #   batch3 7 个 / 13 卡 / 长极 2h06m（needs += batch2 全部）：
  #     basic-correctness/compile/e2e-integration/engine/kernels/
  #     model-runner-v2/models-basic
  # 时长未知者（compile / model-runner-v2 / lm-eval 从未成功，
  # e2e-integration 仅有失败前 53m38s 的下界）一律不放 batch1——万一它才是
  # 真正的长极，会重新把首批拖成 2 小时。待其跑通有实测值后再回调。
  # 注：kernels 单个 area 就要 2h06m，是任何分批方案的地板；要继续压缩需拆
  # 其测试选集为多 shard 并行，不在本次改动范围。
  #
  # check-changes 决定只有路径命中的 area 真正建 pod（skipped 不占卡），
  # 但 26/26 个 area 的 filter 均含 scripts/ppu/ppu_install_dependency.sh，
  # 故改该脚本的 PR（即 CI 自身的开发 PR）必然全量扇出、每次都付满关键路径。
  # 批次 needs 仅作节奏控制、不传结果：if 已带 always() 且不引用批次 job 的
  # result，前批 failure/skipped 不阻断后批。
  # 待平台在第二台节点预置镜像后可回退本分批。
  ppu-attention:
    needs: [human-review, human-review-waived, build-wheel]
    if: >-
      always() &&
      needs.build-wheel.result == 'success' &&
      (needs.human-review.result == 'success' ||
       needs.human-review-waived.result == 'success')
    uses: ./.github/workflows/test-area-ppu-attention.yml
    with:
      wheel_artifact: ${{ needs.build-wheel.outputs.artifact_name }}
    secrets: inherit

  ppu-model-executor:
    needs: [human-review, human-review-waived, build-wheel]
    if: >-
      always() &&
