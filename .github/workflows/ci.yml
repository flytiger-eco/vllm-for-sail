# PR gates and PPU CI. precheck, ai-code-review and human-review are reusable
# workflows from flytiger-eco/.github:
#   precheck -> smoke-test | ai-code-review | build-wheel
#            -> human-review | skip-human-review -> PPU areas -> Full CI
# Runs triggered by other labels or non-approval reviews skip every job.

name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  actions: read # Needed by the areas; callees cannot widen permissions
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}-${{ ((github.event.action == 'labeled' && github.event.label.name != 'skip-human-review') || (github.event_name == 'pull_request_review' && github.event.review.state != 'approved')) && 'noop' || 'main' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_review' }}

jobs:
  # An approval re-runs the pipeline only when this commit has no passing
  # approval gate yet (human-review times out after 6h). Fork approvals never
  # run it, because the areas' fork guard only checks pull_request events.
  check-run:
    name: Check Whether to Run CI
    if: >-
      (github.event_name == 'pull_request' &&
       (github.event.action != 'labeled' ||
        github.event.label.name == 'skip-human-review')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    outputs:
      run: ${{ steps.check-run.outputs.run }}
    steps:
      - id: check-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          HAS_SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-human-review') }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [[ "$EVENT" == pull_request_review ]]; then
            run=false
            if [[ "$SAME_REPO" == true && "$HAS_SKIP_LABEL" != true ]]; then
              passed=$(gh api --paginate \
                "repos/$REPO/commits/$HEAD_SHA/check-runs?filter=all&per_page=100" \
                --jq '.check_runs[]
                  | select(.conclusion == "success")
                  | select(.name == "Human Review Gate / Human Review Gate"
                           or .name == "Skip Human Review")
                  | .id')
              [[ -n "$passed" ]] || run=true
            fi
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  precheck:
    name: Pre-check
    needs: check-run
    if: needs.check-run.outputs.run == 'true'
    uses: flytiger-eco/.github/.github/workflows/user-precheck.yml@main

  smoke-test:
    name: Smoke Test
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static smoke checks
        run: |
          for f in scripts/ppu/*.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/ppu/check-exclusions.py
          python3 scripts/ppu/check-exclusions.py

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    uses: flytiger-eco/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  # Main wheel plus test toolchain wheels, shared by the areas.
  build-wheel:
    name: Build PPU Wheel
    needs: precheck
    uses: ./.github/workflows/build-ppu-wheel.yml

  # Exactly one approval channel runs; the areas need it to succeed.
  human-review:
    name: Human Review Gate
    needs: [smoke-test, ai-code-review]
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'skip-human-review') &&
      contains(fromJSON('["v0.26.0", "v0.27.0", "v0.28.0"]'), github.event.pull_request.base.ref)
    uses: flytiger-eco/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  # Authors cannot approve their own PRs, so the label (triage permission,
  # logged on the PR timeline) serves as the human approval.
  skip-human-review:
    name: Skip Human Review
    needs: [smoke-test, ai-code-review]
    if: >-
      contains(github.event.pull_request.labels.*.name, 'skip-human-review') &&
      contains(fromJSON('["v0.26.0", "v0.27.0", "v0.28.0"]'), github.event.pull_request.base.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record skip human review
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "✅ Human review skipped via the skip-human-review label."
          echo "PR   : $PR_URL"
          echo "base : $BASE_REF   head: $HEAD_REF"
          echo "Reason: the label was added by a user with triage permission; the PR timeline keeps an audit trail."

  ppu-attention:
    needs: [human-review, skip-human-review, build-wheel]
    if: >-
      !cancelled() &&
      needs.build-wheel.result == 'success' &&
      (needs.human-review.result == 'success' ||
       needs.skip-human-review.result == 'success')
    uses: ./.github/workflows/test-area-ppu-attention.yml
    with:
      wheel_artifact: ${{ needs.build-wheel.outputs.artifact_name }}
    secrets: inherit

  ppu-samplers:
    needs: [human-review, skip-human-review, build-wheel]
    if: >-
      !cancelled() &&
      needs.build-wheel.result == 'success' &&
      (needs.human-review.result == 'success' ||
       needs.skip-human-review.result == 'success')
    uses: ./.github/workflows/test-area-ppu-samplers.yml
    with:
      wheel_artifact: ${{ needs.build-wheel.outputs.artifact_name }}
    secrets: inherit

  ppu-benchmarks:
    needs: [human-review, skip-human-review, build-wheel]
    if: >-
      !cancelled() &&
      needs.build-wheel.result == 'success' &&
      (needs.human-review.result == 'success' ||
       needs.skip-human-review.result == 'success')
    uses: ./.github/workflows/test-area-ppu-benchmarks.yml
    with:
      wheel_artifact: ${{ needs.build-wheel.outputs.artifact_name }}
    secrets: inherit

  # Requires every job plus one approval channel. Runs with a skipped precheck
  # report no conclusion.
  ci:
    name: Full CI
    needs:
      - check-run
      - precheck
      - smoke-test
      - ai-code-review
      - build-wheel
      - human-review
      - skip-human-review
      - ppu-attention
      - ppu-samplers
      - ppu-benchmarks
    if: >-
      !cancelled() &&
      (needs.precheck.result != 'skipped' ||
       needs.check-run.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 -c "
          import json, sys, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          for job, info in needs.items():
              print('{}: {}'.format(job, info.get('result', 'unknown')))

          required_success = (
              'precheck', 'smoke-test', 'ai-code-review', 'build-wheel',
              'ppu-attention', 'ppu-samplers', 'ppu-benchmarks',
          )
          failed = [
              '{} ({})'.format(
                  job, needs.get(job, {}).get('result', 'missing'))
              for job in required_success
              if needs.get(job, {}).get('result') != 'success'
          ]

          approval_jobs = ('human-review', 'skip-human-review')
          if not any(
              needs.get(job, {}).get('result') == 'success'
              for job in approval_jobs
          ):
              failed.append('approval gate (no successful channel)')

          if failed:
              print('Failed jobs: ' + ','.join(failed))
              sys.exit(1)
          print('All required jobs completed successfully')
          "
