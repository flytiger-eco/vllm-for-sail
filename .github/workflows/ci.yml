# flytiger-eco 组织统一 PR 门禁 + PPU per-PR CI 的统一编排入口。
# 开发者使用说明见 scripts/ppu/docs/ppu-per-pr-ci-guide.md。
#
# 链（对齐组织门禁流水线）：
#   pr（无需打标签）→ precheck → (smoke-test ∥ ai-code-review ∥ build-wheel)
#                                   └→ human-review → PPU area ×3
#                                      （门禁通过后固定全跑 3 个 area）
#
# - 普通 PR 无需选集标签即可进入完整门禁链；通过后固定执行
#   attention / samplers / benchmarks，不按变更路径筛选。
# - 三条组织门禁（precheck / ai-code-review / human-review）是
#   flytiger-eco/.github 的 reusable workflow，逻辑集中维护、自带 permissions，
#   本文件只做 uses + needs 编排。human-review 另有一条本地跳过 human review 通道，见 Stage 3b。
# - PPU area 测试经 workflow_call 调用本仓库 test-area-ppu-*.yml，
#   继承 PR 上下文，保留同仓库 PR 检查和设备隔离。
# - 可选标签 skip-human-review：跳过 human review，改走本地跳过 human review 通道。
# - concurrency 单组互斥：同一 PR 任何时刻只有一个 CI run 在跑，且存活的 run
#   必然覆盖全部 3 个 PR area（推导见下方 concurrency 注释）。

name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  actions: read # 透传 area：callee 权限只降不升
  pull-requests: read

concurrency:
  # 只有 skip-human-review 标签影响审批；其他标签不取消正在运行的主流水线。
  group: ci-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && github.event.label.name != 'skip-human-review' && 'noop' || 'main' }}
  cancel-in-progress: true

jobs:
  # Stage 1: 密钥扫描预检（组织级 reusable workflow）
  precheck:
    name: Pre-check
    uses: flytiger-eco/.github/.github/workflows/user-precheck.yml@main

  # Stage 2: 冒烟测试 与 AI 评审 并行
  smoke-test:
    name: Smoke Test
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # PPU CI 静态冒烟：shell/python 语法 + 排除项有效性。
      # 不与现有 workflow 重复：pre-commit 全套检查由 pre-commit.yml 负责；
      # check-exclusions 在 selfcheck 里有 paths 过滤，这里每个 PR 都跑。
      - name: Static smoke checks
        run: |
          for f in scripts/ppu/*.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/ppu/check-exclusions.py
          python3 scripts/ppu/check-exclusions.py

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    uses: flytiger-eco/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  # ---- Stage 2b: PPU wheel 构建 ----
  # 经 workflow_call 复用 build-ppu-wheel.yml：产出 wheel artifact（主 wheel +
  # toolchain/ 测试依赖 wheel）供 3 个 PR area 共用；ccache 经 actions/cache 跨
  # run 持久。ci-smoke 转存版（下载 build-ppu-wheel-test 现成 wheel 重传）已完成
  # 验证退场。
  build-wheel:
    name: Build PPU Wheel
    needs: precheck
    uses: ./.github/workflows/build-ppu-wheel.yml

  # ---- Stage 3: 人工审批门禁 ----
  # 普通 PR 默认走组织 reusable 门禁轮询真人 APPROVED；PR 带 skip-human-review
  # 标签时改走下方的本地 skip-human-review job。两条通道互斥，下游 area 以「任一 success」放行。
  human-review:
    name: Human Review Gate
    needs: [smoke-test, ai-code-review]
    # labeled 事件仅响应 skip-human-review 标签；其他 PR 事件照常进入门禁。
    if: >-
      (github.event.action != 'labeled' ||
       github.event.label.name == 'skip-human-review') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-human-review') &&
      contains(fromJSON('["v0.26.0", "v0.27.0", "v0.28.0", "feat/v0.27-ppu-ci"]'), github.base_ref)
    uses: flytiger-eco/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  # 跳过 human review 通道：GitHub 平台禁止 PR 作者 approve 自己的 PR（UI / REST / GraphQL
  # 一律返回 "Can not approve your own pull request"），而本仓库日常只有作者
  # 一人提交，上面的轮询门禁于是成为结构性死锁：空等 6h 后 failure，3 个
  # PR area 永不派发。带 skip-human-review 标签时由本 job 直接放行：打标签本身即
  # 人工动作、需 triage 权限、在 PR 时间线留痕可审计，授权强度不弱于一次
  # approve。job 名与 human-review 区分，避免 UI 上两个同名 job 混淆；下游 area
  # 以「两条通道任一 success」为放行条件，分支保护仍只需配 Full CI。
  skip-human-review:
    name: Skip Human Review
    needs: [smoke-test, ai-code-review]
    if: >-
      (github.event.action != 'labeled' ||
       github.event.label.name == 'skip-human-review') &&
      contains(github.event.pull_request.labels.*.name, 'skip-human-review') &&
      contains(fromJSON('["v0.26.0", "v0.27.0", "v0.28.0", "feat/v0.27-ppu-ci"]'), github.base_ref)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record skip human review
        run: |
          echo "✅ 已根据 skip-human-review 标签跳过 human review。"
          echo "PR   : ${{ github.event.pull_request.html_url }}"
          echo "base : ${{ github.base_ref }}   head: ${{ github.head_ref }}"
          echo "依据：标签由具 triage 权限者添加，PR 时间线留痕可审计。"

  # ---- Stage 4: PPU area（精简版 ×3）----
  # 固定全跑 attention / samplers / benchmarks，每个 area 1 卡。
  # 其他 area 的手动入口和 nightly 编排保持不变。
  # 显式检查构建及审批结果；取消后不再启动新的 PPU 作业。
  ppu-attention:
    needs: [human-review, skip-human-review, build-wheel]
    if: >-
      !cancelled() &&
      needs.build-wheel.result == 'success' &&
      (needs.human-review.result == 'success' ||
       needs.skip-human-review.result == 'success')
    uses: ./.github/workflows/test-area-ppu-attention.yml
    with:
      wheel_artifact: ${{ needs.build-wheel.outputs.artifact_name }}
    secrets: inherit

  ppu-samplers:
    needs: [human-review, skip-human-review, build-wheel]
    if: >-
      !cancelled() &&
      needs.build-wheel.result == 'success' &&
      (needs.human-review.result == 'success' ||
       needs.skip-human-review.result == 'success')
    uses: ./.github/workflows/test-area-ppu-samplers.yml
    with:
      wheel_artifact: ${{ needs.build-wheel.outputs.artifact_name }}
    secrets: inherit

  ppu-benchmarks:
    needs: [human-review, skip-human-review, build-wheel]
    if: >-
      !cancelled() &&
      needs.build-wheel.result == 'success' &&
      (needs.human-review.result == 'success' ||
       needs.skip-human-review.result == 'success')
    uses: ./.github/workflows/test-area-ppu-benchmarks.yml
    with:
      wheel_artifact: ${{ needs.build-wheel.outputs.artifact_name }}
    secrets: inherit

  # ---- Stage 5: 聚合点（skipped 视为通过；供分支保护配单条 required check）----
  ci:
    name: Full CI
    needs:
      - precheck
      - smoke-test
      - ai-code-review
      - build-wheel
      - human-review
      - skip-human-review
      - ppu-attention
      - ppu-samplers
      - ppu-benchmarks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 -c "
          import json, sys, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          failed = []
          for job, info in needs.items():
              result = info.get('result', 'unknown')
              print(f'{job}: {result}')
              if result not in ('success', 'skipped'):
                  failed.append(f'{job} ({result})')
          if failed:
              print('Failed jobs: ' + ','.join(failed))
              sys.exit(1)
          print('All jobs completed successfully')
          "
