# PR checks and PPU CI, with shared gates from flytiger-eco/.github.
#
# Checks: precheck -> (smoke-test + ai-code-review) -> human-review
# Build: precheck -> build-wheel (PR events only)
# PPU: authorize(run-ci) + build-wheel + smoke-test
#      -> (attention + samplers + benchmarks) -> Full CI
#
# PRs build wheels automatically; `run-ci` enables PPU tests.
# Approvals rerun checks only; Full CI excludes AI and human reviews.

name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  actions: read # Required by PPU areas.
  pull-requests: read

concurrency:
  # Review and ignored events must not cancel PPU runs.
  group: >-
    ci-${{ github.event.pull_request.number }}-${{
    ((github.event_name == 'pull_request' && github.event.action == 'labeled' &&
    github.event.label.name != 'run-ci') ||
    (github.event_name == 'pull_request_review' &&
    (github.event.review.state != 'approved' || github.event.review.user.type == 'Bot')))
    && github.run_id || github.event_name }}
  cancel-in-progress: true

jobs:
  # Re-runs keep the original payload; fetch current labels.
  authorize:
    name: CI Authorization
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action != 'labeled' || github.event.label.name == 'run-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.authorize.outputs.run }}
    steps:
      - id: authorize
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          labels=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.labels[].name')
          if grep -qx run-ci <<<"$labels"; then
            run=true
          else
            run=false
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
          if [[ "$run" == true ]]; then
            echo "✅ PPU tests authorized for ${HEAD_SHA:0:12} by the \`run-ci\` label." >> "$GITHUB_STEP_SUMMARY"
          else
            msg="PPU tests not started for ${HEAD_SHA:0:12}: add the \`run-ci\` label."
            echo "::notice::$msg"
            echo "⏸️ $msg" >> "$GITHUB_STEP_SUMMARY"
          fi

  precheck:
    name: Pre-check
    if: >-
      (github.event_name == 'pull_request' &&
       (github.event.action != 'labeled' || github.event.label.name == 'run-ci')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       github.event.review.user.type != 'Bot')
    uses: flytiger-eco/.github/.github/workflows/user-precheck.yml@main

  smoke-test:
    name: Smoke Test
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static smoke checks
        run: |
          for f in scripts/ppu/*.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/ppu/check-exclusions.py
          python3 scripts/ppu/check-exclusions.py

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    uses: flytiger-eco/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  # Waits up to 6h; later approvals start a new gate-only run.
  human-review:
    name: Human Review Gate
    needs: [smoke-test, ai-code-review]
    uses: flytiger-eco/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  build-wheel:
    name: Build PPU Wheel
    needs: precheck
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build-ppu-wheel.yml

  ppu-attention:
    needs: [authorize, smoke-test, build-wheel]
    if: needs.authorize.outputs.run == 'true'
    uses: ./.github/workflows/test-area-ppu-attention.yml
    with:
      wheel_artifact: ${{ needs.build-wheel.outputs.artifact_name }}
    secrets: inherit

  ppu-samplers:
    needs: [authorize, smoke-test, build-wheel]
    if: needs.authorize.outputs.run == 'true'
    uses: ./.github/workflows/test-area-ppu-samplers.yml
    with:
      wheel_artifact: ${{ needs.build-wheel.outputs.artifact_name }}
    secrets: inherit

  ppu-benchmarks:
    needs: [authorize, smoke-test, build-wheel]
    if: needs.authorize.outputs.run == 'true'
    uses: ./.github/workflows/test-area-ppu-benchmarks.yml
    with:
      wheel_artifact: ${{ needs.build-wheel.outputs.artifact_name }}
    secrets: inherit

  # Aggregate PPU results only; review gates are separate.
  ci:
    name: Full CI
    needs:
      - authorize
      - precheck
      - smoke-test
      - build-wheel
      - ppu-attention
      - ppu-samplers
      - ppu-benchmarks
    if: >-
      !cancelled() &&
      (needs.authorize.outputs.run == 'true' ||
       needs.authorize.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys

          failed = []
          for job, info in json.loads(os.environ["NEEDS_JSON"]).items():
              result = info.get("result", "unknown")
              print(f"{job}: {result}")
              if result != "success":
                  failed.append(f"{job} ({result})")
          if failed:
              sys.exit("Failed jobs: " + ", ".join(failed))
          print("All required jobs completed successfully")
          EOF
