name: Record CI approval

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  approved:
    if: >-
      github.repository == 'flytiger-eco/vllm-for-sail' &&
      github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Approval recorded; the PR author may use /ci run."
