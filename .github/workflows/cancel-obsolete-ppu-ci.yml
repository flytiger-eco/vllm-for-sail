name: Cancel obsolete PPU CI

on:
  pull_request_target:
    types: [synchronize, closed, converted_to_draft, edited, unlabeled]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: >-
    ppu-ci-lifecycle-${{
    github.event.pull_request.number || github.event_name }}
  cancel-in-progress: false
  queue: max

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - name: Cancel ineligible or superseded PPU runs
        env:
          GITHUB_TOKEN: ${{ secrets.CI_BRANCH_UPDATE_TOKEN || github.token }}
          CI_TRUSTED_USERS: ${{ vars.CI_TRUSTED_USERS }}
        run: python -m scripts.ci.ppu_ci_lifecycle
