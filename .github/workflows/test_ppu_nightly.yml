# Rerun of the v0.26.0 cases that failed in nightly run 41978966338
# (Nightly PPU test #18: attention / kernels / misc / models-multimodal).
# Triggered by a PR against v0.26.0 so the failed-case rerun runs as PR CI:
# open the PR from test/v0.26 into v0.26.0 and this workflow picks it up.
#
# Structure (mirrors ppu-build-nightly.yml of the ci/ppu-nightly-all-areas
# branch, narrowed to the failed cases):
#   build-wheel -- build the v0.26.0 wheel from the PR head (ccache + Rust cache)
#   test        -- 4-area matrix; each leg installs the verified wheel in the
#                  PPU pod and runs scripts/ppu/test-failed-ppu-<area>.sh
#   test-finish -- branch-protection aggregation point
name: Nightly PPU test (v0.26.0 failed cases)

on:
  pull_request:
    branches:
      - v0.26.0
  workflow_dispatch:

# A new push to the PR supersedes the previous run.
concurrency:
  group: test-ppu-nightly-v0-26-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  RELEASE: v0.26.0
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:sdk2.2.0-pytorch2.13.0-ubuntu24.04-cuda13.0-vllm0.27.0-py312-20261001
  PPU_BUILD_IMAGE: pkg.flytiger-eco.com/docker_build/pytorch:ubuntu24.04-py312.06

jobs:
  build-wheel:
    name: Build v0.26.0 wheel
    runs-on: ubuntu-latest
    timeout-minutes: 480
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
      head_sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve head SHA
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ppu-ccache
          # Per-run key (GitHub caches are immutable); restore falls back to the
          # previous PR-test chain and then to the PR build caches saved on the
          # default branch (same compiler, SDK and flags).
          key: test-ppu-v0.26-ccache-${{ github.run_id }}
          restore-keys: |
            test-ppu-v0.26-ccache-
            ppu-ccache-${{ runner.os }}-cu13.0-sdk2.2.0-
      - name: Compute Rust cache key
        id: rust-key
        env:
          INPUT_HASH: ${{ hashFiles('rust/**', 'rust-toolchain.toml', 'tools/build_rust.py', 'build_rust.sh', 'setup.py', 'pyproject.toml', 'vllm/envs.py', 'requirements/build/*.txt', 'requirements/ppu.txt', 'requirements/common.txt', 'scripts/ppu/ppu_ci_nightly_build_wheel.sh') }}
        run: |
          test -n "$INPUT_HASH"
          docker pull "$PPU_BUILD_IMAGE"
          image_id="$(docker image inspect --format '{{.Id}}' "$PPU_BUILD_IMAGE")"
          test -n "$image_id"
          echo "PPU_BUILD_IMAGE=$image_id" >> "$GITHUB_ENV"
          echo "RUST_CACHE_DIR=$RUNNER_TEMP/ppu-rust-artifacts" >> "$GITHUB_ENV"
          echo "key=test-ppu-v0.26-rust-${image_id#sha256:}-$INPUT_HASH" >> "$GITHUB_OUTPUT"
      - name: Restore Rust artifacts
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ppu-rust-artifacts
          key: ${{ steps.rust-key.outputs.key }}
      - name: Stage complete Rust cache
        if: steps.rust-cache.outputs.cache-hit == 'true'
        run: |
          shopt -s nullglob
          parsers=("$RUST_CACHE_DIR"/_rust_tool_parser*.so)
          if [[ -s "$RUST_CACHE_DIR/vllm-rs" && ${#parsers[@]} -eq 1 && -s "${parsers[0]}" ]]; then
            install -m 755 "$RUST_CACHE_DIR/vllm-rs" "${parsers[0]}" vllm/
          else
            echo "::warning::Incomplete Rust cache; rebuilding from source"
          fi
      - name: Build wheel and provenance
        id: build
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          MAX_JOBS="$(nproc)"
          NVCC_THREADS=1
          HOST_CCACHE_DIR="$RUNNER_TEMP/ppu-ccache"
          VLLM_VERSION_OVERRIDE="0.26.0.dev$(date -u +%Y%m%d)+g$(git rev-parse --short HEAD)"
          export MAX_JOBS NVCC_THREADS HOST_CCACHE_DIR VLLM_VERSION_OVERRIDE
          mkdir -p "$HOST_CCACHE_DIR"
          bash scripts/ppu/ppu_ci_nightly_build_wheel.sh "0.26.0" 3.12 13.0 x86_64
          python3 - "$HEAD_SHA" "$VLLM_VERSION_OVERRIDE" <<'PY'
          import hashlib, json, pathlib, sys, zipfile
          head_sha, version = sys.argv[1:]
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode()
              assert f"Name: vllm\n" in metadata
              assert f"Version: {version}\n" in metadata
              assert "vllm/_version.py" in archive.namelist()
          manifest = {
              "release": "v0.26.0", "source_sha": head_sha, "ci_sha": head_sha,
              "wheel": wheel.name, "version": version,
              "wheel_sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
          }
          pathlib.Path("dist/manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest))
          PY
          echo "artifact_name=test-ppu-nightly-${{ github.run_id }}-${{ github.run_attempt }}-v0.26.0" >> "$GITHUB_OUTPUT"
      - name: Fix ccache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/ppu-ccache" || true
      - name: Save ccache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ppu-ccache
          key: test-ppu-v0.26-ccache-${{ github.run_id }}
      - name: Extract Rust artifacts
        id: rust-artifacts
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          mkdir -p "$RUST_CACHE_DIR"
          if unzip -jo "${wheels[0]}" 'vllm/vllm-rs' 'vllm/_rust_tool_parser*.so' -d "$RUST_CACHE_DIR"; then
            parsers=("$RUST_CACHE_DIR"/_rust_tool_parser*.so)
            if [[ -s "$RUST_CACHE_DIR/vllm-rs" && ${#parsers[@]} -eq 1 && -s "${parsers[0]}" ]]; then
              chmod 755 "$RUST_CACHE_DIR/vllm-rs" "${parsers[0]}"
              echo "ready=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Save Rust artifacts
        if: steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-artifacts.outputs.ready == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ppu-rust-artifacts
          key: ${{ steps.rust-key.outputs.key }}
      - name: Download test toolchain wheels
        continue-on-error: true
        run: |
          mkdir -p dist/toolchain
          python3 -m pip download --no-deps pytest pytest-asyncio tblib pytest-shard pyyaml \
            -d dist/toolchain \
            -i https://pkg.flytiger-eco.com/artifactory/api/pypi/pypi_index/simple
      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: |
            dist/*.whl
            dist/manifest.json
            dist/toolchain/*.whl
          if-no-files-found: error

  test:
    name: v0.26.0 / OAM-810E / ${{ matrix.area }}
    needs: build-wheel
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          # exactly the areas that failed in nightly run 41978966338 on v0.26.0
          # job_timeout = run_timeout (in-pod action timeout) + 25 min orchestration
          # overhead; GitHub expressions do not support arithmetic, hence the
          # explicit field.
          - area: attention
            script: test-failed-ppu-attention.sh
            nproc: 1
            run_timeout: 15
            job_timeout: 40
          - area: kernels
            script: test-failed-ppu-kernels.sh
            nproc: 1
            run_timeout: 30
            job_timeout: 55
          - area: misc
            script: test-failed-ppu-misc.sh
            nproc: 1
            run_timeout: 10
            job_timeout: 35
          - area: models-multimodal
            script: test-failed-ppu-models_multimodal.sh
            nproc: 1
            run_timeout: 60
            job_timeout: 85
    timeout-minutes: ${{ matrix.job_timeout }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build-wheel.outputs.artifact_name }}
          path: ci-wheel
      - name: Build in-pod runner payload
        id: payload
        env:
          AREA: ${{ matrix.area }}
          AREA_SCRIPT: ${{ matrix.script }}
          HEAD_SHA: ${{ needs.build-wheel.outputs.head_sha }}
        run: |
          python3 - "$HEAD_SHA" <<'PY'
          import hashlib, json, os, pathlib
          manifest = json.loads(pathlib.Path("ci-wheel/manifest.json").read_text())
          assert manifest["release"] == "v0.26.0", manifest
          assert manifest["source_sha"] == os.environ["HEAD_SHA"], manifest
          wheels = list(pathlib.Path("ci-wheel").glob("*.whl"))
          assert len(wheels) == 1 and wheels[0].name == manifest["wheel"]
          assert hashlib.sha256(wheels[0].read_bytes()).hexdigest() == manifest["wheel_sha256"]
          PY
          cat > /tmp/ppu-run.sh <<'RUNEOF'
          #!/bin/bash
          set -euo pipefail
          cd /workspace/source
          echo "[k8s-failed-cases] release=v0.26.0 area=${AREA} head=${PPU_SOURCE_SHA}"
          bash scripts/ppu/ppu_ci_nightly_install_dependency.sh
          bash "scripts/ppu/${AREA_SCRIPT}"
          RUNEOF
          bash -n /tmp/ppu-run.sh
          wheel="$(find ci-wheel -maxdepth 1 -name '*.whl' -print -quit)"
          {
            echo "b64=$(base64 < /tmp/ppu-run.sh | tr -d '\n')"
            echo "wheel_path=/workspace/source/${wheel}"
            echo "wheel_sha256=$(sha256sum "${wheel}" | cut -d ' ' -f1)"
            echo "wheel_version=$(python3 -c 'import json; print(json.load(open("ci-wheel/manifest.json"))["version"])')"
          } >> "$GITHUB_OUTPUT"
      - name: Run PPU tests
        id: ppu
        uses: flytiger-eco/ppu-distributed-action@06c8ee7cadaae2086db4977e571b19f461653f16
        with:
          nnodes: 0
          nproc_per_node: ${{ matrix.nproc }}
          node_selector: board-type=OAM-810E
          image: ${{ env.PPU_BASE_IMAGE }}
          namespace: ppu-sched
          job_suffix: test-v026-${{ matrix.area }}
          timeout_minutes: ${{ matrix.run_timeout }}
          cleanup_policy: always
          container_options: |
            host_ipc: true
            shm_size: "8Gi"
          extra_env: >-
            HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_DEVICE_LABEL=OAM-810E,PPU_RELEASE=v0.26.0,PPU_SOURCE_SHA=${{ needs.build-wheel.outputs.head_sha }},PPU_CI_SHA=${{ needs.build-wheel.outputs.head_sha }},PPU_WHEEL_PATH=${{ steps.payload.outputs.wheel_path }},PPU_WHEEL_SHA256=${{ steps.payload.outputs.wheel_sha256 }},PPU_EXPECTED_VLLM_VERSION=${{ steps.payload.outputs.wheel_version }},PPU_TOOLCHAIN_DIR=/workspace/source/ci-wheel/toolchain,AREA=${{ matrix.area }},AREA_SCRIPT=${{ matrix.script }},PPU_SUMMARY_NAS_DIR=/mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/${{ github.job }}/v0.26.0/OAM-810E/${{ matrix.area }},PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }}
          command: echo ${{ steps.payload.outputs.b64 }} | base64 -d > /tmp/ppu-run.sh && bash /tmp/ppu-run.sh
      - name: Publish test summary
        if: always()
        env:
          AREA: ${{ matrix.area }}
          SOURCE_SHA: ${{ needs.build-wheel.outputs.head_sha }}
          WHEEL_SHA256: ${{ steps.payload.outputs.wheel_sha256 }}
          OUT_JOB_NAME: ${{ steps.ppu.outputs.job_name }}
          OUT_JOB_STATUS: ${{ steps.ppu.outputs.job_status }}
          OUT_DURATION: ${{ steps.ppu.outputs.duration_seconds }}
          OUT_TASK_PODS: ${{ steps.ppu.outputs.task_pods }}
          OUT_LOG_ARTIFACT: ${{ steps.ppu.outputs.log_artifact_name }}
        run: |
          NAS_SUM="/wl_nas/devops/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${GITHUB_JOB}/v0.26.0/OAM-810E/${AREA}/summary.md"
          {
            echo "## v0.26.0 / ${AREA} / OAM-810E (failed-case rerun)"
            echo "Source SHA: \`${SOURCE_SHA}\`"
            echo "Wheel SHA256: \`${WHEEL_SHA256}\`"
            if [ -f "${NAS_SUM}" ]; then
              cat "${NAS_SUM}"
            else
              echo "summary.md was not returned; this area did not pass."
              exit 1
            fi
            echo "K8s job: \`${OUT_JOB_NAME:-<empty>}\` · ${OUT_JOB_STATUS:-<empty>} · ${OUT_DURATION:-<empty>}s · pods: \`${OUT_TASK_PODS:-<empty>}\` · log: \`${OUT_LOG_ARTIFACT:-<empty>}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  test-finish:
    needs: [build-wheel, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful build and all failed-case areas
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 -c '
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          print(json.dumps(needs, indent=2))
          failed = [name for name, info in needs.items() if info.get("result") != "success"]
          if failed:
              print("Unsuccessful jobs: " + ", ".join(failed))
              sys.exit(1)
          '
