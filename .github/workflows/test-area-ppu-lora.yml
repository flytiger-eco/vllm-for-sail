# Aone CI `.aoneci/test-area-ppu-lora.yaml` 的 GitHub Actions 移植版
# （源自 `.buildkite/test_areas/lora.yaml` + `aone_ci/ppu_extras/lora.yaml`）。
#
# 结构（仿 sglang-for-sail 的 `.github/workflows/pr-test-ppu.yml`）：
#   check-changes — 路径变更门禁（对位 Aone diff-guard）
#   ppu-lora-test — K8s worker Pod 内装依赖 + 跑 pytest（编排壳 CPU-only，零占卡）
#   ppu-lora-finish — 分支保护聚合点
#
# 自包含，无 aone_ci 依赖；测试选集（pytest 文件与 --ignore）见
# scripts/ppu/test-area-ppu-lora.sh，模型来自挂载的 /nas_aisw 卷。
name: LoRA Test (PPU)

on:
  # 重量级 area（PPU 整机仅一个 runner，job 串行；本档最长实测 2h14min）：
  # PR 上由 ppu-full 标签显式拉起，夜间/周末由 nightly-ppu.yml 兜底。
  # 依赖路径清单保留在下方 check-changes 的 dorny 过滤器中。
  # PR 入口收编到 ci.yml：带 ppu-full 标签的 PR 走完完整门禁链
  # （precheck → smoke-test ∥ ai-code-review → human-review）后以
  # workflow_call 调用本 workflow；标签/base 判定在 ci.yml 侧，下方
  # check-changes 的标签闸门仍生效（双保险）。
  workflow_call:
    inputs:
      test_mode:
        description: "TEST_MODE：all(默认) | single | multi"
        type: string
        default: all
      pytest_args:
        description: '追加的 pytest 参数，如 "-k test_foo -x"（透传 PYTEST_EXTRA_ARGS）'
        type: string
        default: ""
      wheel_artifact:
        description: "CI 构建的 wheel artifact 名（ci.yml 传入）；空则用镜像预装 vllm"
        type: string
        default: ""
  # 无 inputs：手动触发跑与 push/PR 相同的全量 LoRA 测试。
  workflow_dispatch:
    inputs:
      test_mode:
        description: "TEST_MODE：all(默认) | single | multi"
        type: string
        default: all
      pytest_args:
        description: '追加的 pytest 参数，如 "-k test_foo -x"（透传 PYTEST_EXTRA_ARGS）'
        type: string
        default: ""

# 所有 PPU area workflow 共用同名 group：自托管 runner 的 PPU 设备互斥
# （并发 job 争抢 CUDA_VISIBLE_DEVICES 与显存会 OOM），同名 group 实现
# 跨 workflow 串行。
concurrency:
  group: test-area-ppu-lora-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # SAIL SDK v2.1.1 镜像，预装 vLLM 0.23.0（PPU 移植基线）
  PPU_BASE_IMAGE: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-vllm0.23.0-py312

jobs:
  # ==================== 变更检查（diff 门禁） ==================== #
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      changes_exist: ${{ steps.decide.outputs.changes_exist }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 仅 PR 用 dorny/paths-filter（走 GitHub API，不依赖 git 历史）。
      # push 不用它：浅克隆下与默认分支（v0.20.1）无 merge-base，deepen
      # 重试报 "fatal: shallow file has changed"（128）。push 已由
      # on.push.paths 触发级过滤；本列表须与 on.push.paths 保持同步。
      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        with:
          filters: |
            ppu_code:
              - ".github/workflows/test-area-ppu-lora.yml"
              - "scripts/ppu/ppu_install_dependency.sh"
              - "scripts/ppu/test-area-ppu-lora.sh"
              - "tests/lora/**"
              - "vllm/lora/**"

      - name: Decide whether to run tests
        id: decide
        env:
          FILTER_HIT: ${{ steps.filter.outputs.ppu_code }}
          HAS_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ppu-full') }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # 重量级 area 在 PR 上默认不跑，需显式打 ppu-full 标签；
            # 路径命中结果仅记录，作为后续提升为自动触发档的观测数据。
            echo "[gate] paths_hit=${FILTER_HIT:-false} ppu_full_label=${HAS_FULL_LABEL}"
            echo "changes_exist=${HAS_FULL_LABEL}" >> "$GITHUB_OUTPUT"
          else
            # 手动触发（workflow_dispatch）：必跑
            echo "changes_exist=true" >> "$GITHUB_OUTPUT"
          fi

  # ==================== PPU LoRA 测试 ==================== #
  ppu-lora-test:
    needs: [check-changes]
    # fork PR 不进特权 PPU worker Pod（privileged + 设备直通 +
    # NAS 挂载 + artifactory 凭证，不能被外部 PR 的代码驱动）
    if: >-
      needs.check-changes.outputs.changes_exist == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 115
    steps:
      # checkout 是 action 源码自动投递的前提：action 把 $GITHUB_WORKSPACE 打包
      # 暂存到 NAS，worker Pod 内解压到 source_dir（默认 /workspace/source）。
      # fetch-depth: 1 缩小 .git，减少打包体积与耗时。
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ci.yml 传入 wheel_artifact 时，下载 build-wheel job 的产物到 ci-wheel/，
      # 由 ppu_install_dependency.sh 装它而非借镜像 .so；空则跳过（沿用现状）。
      - name: Fetch CI-built wheel
        if: inputs.wheel_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.wheel_artifact }}
          path: ci-wheel
      - name: Resolve wheel path
        if: inputs.wheel_artifact != ''
        run: |
          whl="$(ls ci-wheel/*.whl | head -n1)"
          # ci-wheel/ 在 $GITHUB_WORKSPACE 内，随源码 tarball 一并投递进 Pod
          echo "PPU_WHEEL_PATH=/workspace/source/ci-wheel/$(basename "$whl")" >> "$GITHUB_ENV"

      - name: Build in-pod runner payload
        id: payload
        shell: bash
        env:
          TEST_MODE: ${{ inputs.test_mode || 'all' }}
          PYTEST_EXTRA_ARGS: ${{ inputs.pytest_args || '' }}
        run: |
          # 为什么绕 base64：ppu-distributed-action 的「校验 inputs」步骤把
          # inputs.command 直接文本插值进 `if [ -z "<command>" ]`，多行/含引号的
          # command 会引发 shell syntax error。base64 后是单行且只含
          # [A-Za-z0-9+/=]，被那对双引号整段吞掉，安全无副作用。
          cat > /tmp/ppu-run.sh <<'RUNEOF'
          #!/bin/bash
          set -euo pipefail
          cd /workspace/source
          echo "[k8s-area] node=${NODE_NAME:-unknown} TEST_MODE=${TEST_MODE:-all}"
          bash scripts/ppu/ppu_install_dependency.sh
          bash scripts/ppu/test-area-ppu-lora.sh
          RUNEOF
          # 语法自检：runner 上早失败好过在 Pod 里烧一次调度
          bash -n /tmp/ppu-run.sh
          # tr 而非 base64 -w0：后者是 GNU 专有
          echo "b64=$(base64 < /tmp/ppu-run.sh | tr -d '\n')" >> "$GITHUB_OUTPUT"
          # extra_env 以逗号分隔 KEY=VAL，值内不能含逗号；空值项一律不下发
          envs="HF_HUB_CACHE=/nas_aisw/datasets/hf_cache/hub,PPU_DEVICE_LABEL=OAM-810E"
          envs="${envs},TEST_MODE=${TEST_MODE:-all}"
          if [ -n "${PYTEST_EXTRA_ARGS:-}" ]; then
            envs="${envs},PYTEST_EXTRA_ARGS=${PYTEST_EXTRA_ARGS}"
          fi
          if [ -n "${PPU_WHEEL_PATH:-}" ]; then
            envs="${envs},PPU_WHEEL_PATH=${PPU_WHEEL_PATH}"
          fi
          echo "extra_env=${envs}" >> "$GITHUB_OUTPUT"

      - name: Run PPU LoRA tests
        id: ppu
        uses: flytiger-eco/ppu-distributed-action@main
        with:
          # 单机；nproc_per_node = 本 area 实际需要的 PPU 卡数
          #（lora_full 段 4 shards 并行，每 shard 占 1 卡）
          nnodes: 0
          nproc_per_node: 4
          node_selector: board-type=OAM-810E
          # /nas_aisw、/mnt/wl_nas 由 action 默认挂载，无需传 host_volumes
          image: ${{ env.PPU_BASE_IMAGE }}
          namespace: ppu-sched
          # 对齐自托管版 in-pod 上限
          timeout_minutes: 90
          cleanup_policy: always
          # 对位自托管版 docker --privileged --ipc=host --shm-size=8g
          #（--ulimit memlock=-1 无 K8s 等价物，privileged 下进程可自行提升）
          container_options: |
            privileged: true
            host_ipc: true
            shm_size: "8Gi"
          extra_env: ${{ steps.payload.outputs.extra_env }},PPU_ARTIFACTORY_USER=${{ secrets.PPU_ARTIFACTORY_USER }},PPU_ARTIFACTORY_PASSWORD=${{ secrets.PPU_ARTIFACTORY_PASSWORD }}
          # 必须单行、不含双引号，见上面 payload 步骤注释
          command: echo ${{ steps.payload.outputs.b64 }} | base64 -d > /tmp/ppu-run.sh && bash /tmp/ppu-run.sh

      # junit/summary 落在 Pod 内 /workspace/source/test-results/，Pod 回收即消失，
      # 故不再走 upload-artifact + junit 注解；用例明细见上一步日志（action 全量
      # 透传 Pod stdout，并另存为 log artifact）。
      - name: Report action outputs
        if: always()
        env:
          OUT_JOB_NAME: ${{ steps.ppu.outputs.job_name }}
          OUT_JOB_STATUS: ${{ steps.ppu.outputs.job_status }}
          OUT_DURATION: ${{ steps.ppu.outputs.duration_seconds }}
          OUT_TASK_PODS: ${{ steps.ppu.outputs.task_pods }}
          OUT_LOG_ARTIFACT: ${{ steps.ppu.outputs.log_artifact_name }}
          TEST_MODE: ${{ inputs.test_mode || 'all' }}
        run: |
          {
            echo "### LoRA Test (PPU, K8s)"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| test_mode | ${TEST_MODE:-all} |"
            echo "| image | \`${PPU_BASE_IMAGE}\` |"
            echo "| job_name | ${OUT_JOB_NAME:-<empty>} |"
            echo "| job_status | ${OUT_JOB_STATUS:-<empty>} |"
            echo "| duration_seconds | ${OUT_DURATION:-<empty>} |"
            echo "| task_pods | ${OUT_TASK_PODS:-<empty>} |"
            echo "| log_artifact | ${OUT_LOG_ARTIFACT:-<empty>} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==================== 聚合点（分支保护） ==================== #
  ppu-lora-finish:
    needs: [check-changes, ppu-lora-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 -c "
          import json, sys, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          failed = []
          for job, info in needs.items():
              result = info.get('result', 'unknown')
              print(f'{job}: {result}')
              if result not in ('success', 'skipped'):
                  failed.append(f'{job} ({result})')
          if failed:
              sep = ','
              print(f'Failed jobs: {sep.join(failed)}')
              sys.exit(1)
          print('All jobs completed successfully')
          "
