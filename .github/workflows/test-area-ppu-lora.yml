# Aone CI `.aoneci/test-area-ppu-lora.yaml` 的 GitHub Actions 移植
# （Aone 侧由 .buildkite/test_areas/lora.yaml + aone_ci/ppu_extras/lora.yaml 生成）。
#
# 结构：check-changes（路径过滤门卫）→ ppu-lora-test（ARC pod 内跑 pytest）
#       → ppu-test-finish（聚合点，供分支保护挂接）。
#
# Runner（DevOps ARC k8s 集群，flytiger-eco 组织）：runs-on 按实际用卡数选规格
# k8s-runner-group-flytiger-ppu{1,2,4,8,16}（两组织共享节点池）；container.image
# 必填且须字面量（该位置不支持 env 上下文）；PPU 设备由 pod template 透传，
# 每 job 全新 pod——无需 docker run / 设备参数 / clean workspace。
# 本 area 卡数依据：single 4-shard（每 shard 一卡，峰值 4 卡）；multi TP=2 串行其后。
#
# 用例选集在 scripts/ppu/test-area-ppu-lora.sh（快照自 ppu_extras，运行时零依赖
# aone_ci）；模型走 /nas_aisw 卷——novolume 模式业务侧不能挂卷，依赖 pod
# template 预挂 NAS（HF_HUB_CACHE 路径不存在时找 DevOps 确认）。
name: LoRA Test (PPU)

on:
  push:
    branches: [feat/gha-ppu-test]
    # push路径过滤（服务端判定）：push 的过滤只能在这里做——check-changes
    # 里的 paths-filter 在 push 上受浅克隆历史限制会失败，仅用于 PR。
    # 此列表与下方 filters 保持一致。
    paths:
      - ".github/workflows/test-area-ppu-lora.yml"
      - "scripts/ppu/ppu_install_dependency.sh"
      - "scripts/ppu/test-area-ppu-lora.sh"
      - "tests/lora/**"
      - "vllm/lora/**"
  pull_request:
    branches: [feat/gha-ppu-test]
  workflow_dispatch:

concurrency:
  group: test-area-ppu-lora-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read


jobs:
  # ==================== check-changes ==================== #
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      changes_exist: ${{ steps.decide.outputs.changes_exist }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 仅 PR 使用：paths-filter 走 GitHub API、不依赖 git 历史；push 场景在
      # 浅克隆下找不到 merge-base 会失败，已由 on.push.paths 在触发级过滤。
      # 此列表与 on.push.paths 保持一致。
      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        with:
          filters: |
            ppu_code:
              - ".github/workflows/test-area-ppu-lora.yml"
              - "scripts/ppu/ppu_install_dependency.sh"
              - "scripts/ppu/test-area-ppu-lora.sh"
              - "tests/lora/**"
              - "vllm/lora/**"

      - name: Decide whether to run tests
        id: decide
        env:
          FILTER_HIT: ${{ steps.filter.outputs.ppu_code }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # PR：按路径过滤结果决定是否跑
            echo "changes_exist=${FILTER_HIT:-false}" >> $GITHUB_OUTPUT
          else
            # push/手动：直接放行（push 已被触发级过滤，手动 = 无条件全量）
            echo "changes_exist=true" >> $GITHUB_OUTPUT
          fi

  # ==================== PPU LoRA 测试（4 卡 ARC pod） ==================== #
  ppu-lora-test:
    needs: [check-changes]
    if: needs.check-changes.outputs.changes_exist == 'true'
    runs-on: k8s-runner-group-flytiger-ppu4
    container:
      # SAIL SDK v2.1.1 镜像（预装 vLLM 0.23.0，PPU 基线）
      image: pkg.flytiger-eco.com/docker_release/llm:v2.1.1-pytorch2.11.0-ubuntu24.04-cuda13.0-vllm0.23.0-py312
    timeout-minutes: 100
    env:
      # job 级 env 自动注入容器（等效原 docker run -e 透传）
      HF_HUB_CACHE: /nas_aisw/datasets/hf_cache/hub
      PPU_DEVICE_LABEL: OAM-810E
      PPU_ARTIFACTORY_USER: ${{ secrets.PPU_ARTIFACTORY_USER }}
      PPU_ARTIFACTORY_PASSWORD: ${{ secrets.PPU_ARTIFACTORY_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run PPU LoRA tests
        timeout-minutes: 80
        # steps 直接运行在 PPU 容器内（cwd = workspace）
        run: |
          bash scripts/ppu/ppu_install_dependency.sh
          bash scripts/ppu/test-area-ppu-lora.sh

      # 脚本 EXIT trap 产出 test-results/summary.md
      - name: Publish test summary
        if: always()
        run: |
          f="test-results/summary.md"
          if [ -f "$f" ]; then
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### LoRA Test (PPU)"
              echo ""
              echo "summary.md not produced — the test script exited"
              echo "before its EXIT trap fired (see 'Run PPU LoRA tests' log)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-lora-test-results
          path: |
            test-results/
          if-no-files-found: warn

  # ==================== finish ==================== #
  ppu-test-finish:
    needs: [check-changes, ppu-lora-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 -c "
          import json, sys, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          failed = []
          for job, info in needs.items():
              result = info.get('result', 'unknown')
              print(f'{job}: {result}')
              if result not in ('success', 'skipped'):
                  failed.append(f'{job} ({result})')
          if failed:
              sep = ','
              print(f'Failed jobs: {sep.join(failed)}')
              sys.exit(1)
          print('All jobs completed successfully')
          "
